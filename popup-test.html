<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стенд попапов · UNOVIS AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #4a4a4a;
      padding: 24px 8px 80px;
      margin: 0;
      font-family: 'Onest', system-ui, sans-serif;
      min-height: 100vh;
    }
    h1.page-title {
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 32px;
      opacity: 0.85;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 440px;
      margin: 0 auto;
    }
    .item .label {
      color: #fff;
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.6;
      margin: 0 0 8px 4px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ===== Стили попапа — копия с ar.html ===== */
    .popup-card {
      background: #FFFFFF;
      color: #111;
      padding: 28px 26px 26px;
      max-width: 420px;
      width: 100%;
      position: relative;
      border-left: 11px solid #CF1417;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      box-shadow: 8px 8px 0 rgba(216, 48, 26, 0.25);
    }
    .popup-title {
      font-family: 'Onest', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: -0.3px;
      margin: 0 0 6px;
      color: #111;
      text-transform: uppercase;
      line-height: 1.1;
      display: inline-block;
      transform: scaleX(0.82);
      transform-origin: left center;
    }
    .popup-accent {
      height: 6px;
      width: 48%;
      background: #CF1417;
      margin: 0 0 14px;
    }
    .popup-body {
      font-family: 'Onest', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.3;
      letter-spacing: -0.2px;
      color: #1a1a1a;
      text-align: justify;
      text-wrap: pretty;
      hyphens: manual;
      -webkit-hyphens: manual;
      overflow-wrap: break-word;
    }
    .popup-body .popup-lead {
      display: block;
      margin-bottom: 0.25em;
    }
    @media (max-width: 480px) {
      .popup-body {
        font-size: 15px;
      }
    }
    .popup-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #111;
      line-height: 1;
      padding: 4px 10px;
    }
  </style>
</head>
<body>

  <h1 class="page-title">Стенд попапов · 18 уникальных текстов</h1>
  <div class="grid" id="grid"></div>

  <script>
    // ====== Та же дата что в ar.html ======
    const POPUPS = [
      { key: 'p1-stripes',     title: 'Витебск',                            body: 'Витебск — один из&nbsp;ста&shy;рей&shy;ших городов Республики Беларусь, рас&shy;по&shy;ло&shy;жен&shy;ный на&nbsp;реке Западная Двина. Город обладает богатым на&shy;сле&shy;ди&shy;ем и&nbsp;за&shy;ни&shy;ма&shy;ет важное место в&nbsp;ис&shy;то&shy;рии ис&shy;кус&shy;ства начала&nbsp;XX&nbsp;века.' },
      { key: 'p1-blacksq',     title: 'К. С. Малевич',                      body: 'Основатель суп&shy;ре&shy;ма&shy;тиз&shy;ма и&nbsp;идейный лидер УНО&shy;ВИ&shy;Са.<br>Его работа «Чёрный квадрат» стала символом нового ис&shy;кус&shy;ства, в&nbsp;котором простая ге&shy;о&shy;мет&shy;ри&shy;чес&shy;кая форма заменяет пред&shy;мет&shy;ное и&shy;зоб&shy;ра&shy;же&shy;ние и&nbsp;открывает путь к&nbsp;сво&shy;бод&shy;но&shy;му ви&shy;зу&shy;аль&shy;но&shy;му мыш&shy;ле&shy;нию.' },
      { key: 'p1-stairs',      title: 'Набережная города',                  body: 'Красные элементы являются символом движения и&nbsp;пе&shy;ре&shy;хо&shy;да от&nbsp;реального про&shy;стран&shy;ства к&nbsp;маршруту нового ис&shy;кус&shy;ства. Также это отсылает к&nbsp;лестнице на&nbsp;набережной города.' },
      { key: 'p2-blacksq',     title: 'УНОВИС',                             body: '«Утвердители нового ис&shy;кус&shy;ства». Объединение возникло в&nbsp;Ви&shy;теб&shy;ске в&nbsp;1920&nbsp;году и&nbsp;было связано с&nbsp;идеями К.&nbsp;С.&nbsp;Малевича, суп&shy;ре&shy;ма&shy;тиз&shy;ма и&nbsp;поиском нового ху&shy;до&shy;же&shy;ствен&shy;но&shy;го языка, ос&shy;но&shy;ван&shy;но&shy;го на&nbsp;форме, цвете, про&shy;стран&shy;стве и&nbsp;отказе от&nbsp;тра&shy;ди&shy;ци&shy;он&shy;но&shy;го и&shy;зоб&shy;ра&shy;же&shy;ния.' },
      { key: 'p2-greenline',   title: 'Супрематизм',                        body: 'Это ис&shy;кус&shy;ство чистых форм и&nbsp;цвета. Он&nbsp;отказывается от&nbsp;и&shy;зоб&shy;ра&shy;же&shy;ния тра&shy;ди&shy;ци&shy;он&shy;ной живописи и&nbsp;передаёт идею через ге&shy;о&shy;мет&shy;ри&shy;чес&shy;кие формы, движение и&nbsp;про&shy;стран&shy;ство.' },
      { key: 'p2-redshape',    title: 'Роспись на здании',                  body: '«Стена Малевича» создана по&nbsp;эскизу К.&nbsp;С.&nbsp;Малевича «Принцип росписи стены, плоскости или&nbsp;всей комнаты, или&nbsp;целой квартиры по&nbsp;системе суп&shy;ре&shy;ма&shy;тиз&shy;ма», также известному под названием «Смерть обоям». В&nbsp;этой работе ху&shy;дож&shy;ник предложил перенести суп&shy;ре&shy;ма&shy;ти&shy;чес&shy;кие формы за&nbsp;пределы холста и&nbsp;отражает одну из&nbsp;главных идей аван&shy;гар&shy;да: ис&shy;кус&shy;ство может существовать не&nbsp;только в&nbsp;картине, но&nbsp;и&nbsp;в&nbsp;реальной среде.' },
      { key: 'p3-moon',        title: 'Марк Шагал',                         body: 'Один из&nbsp;главных ху&shy;до&shy;же&shy;ствен&shy;ных символов Витебска. Его творчество связано с&nbsp;образом города, памятью, движением и&nbsp;личным восприятием про&shy;стран&shy;ства.' },
      { key: 'p3-house',       title: 'ВНХУ',                               body: 'Марк Шагал основал Ви&shy;теб&shy;ское на&shy;род&shy;ное ху&shy;до&shy;же&shy;ствен&shy;ное учи&shy;ли&shy;ще (ВНХУ), ставшее важной точкой развития аван&shy;гар&shy;да. Именно в&nbsp;этой ху&shy;до&shy;же&shy;ствен&shy;ной среде позднее возникло объ&shy;е&shy;ди&shy;не&shy;ние УНО&shy;ВИС.' },
      { key: 'p4-malevich',    title: 'Идеи К. С. Малевича',                body: 'В&nbsp;Ви&shy;теб&shy;ске идеи ху&shy;дож&shy;ни&shy;ка получили развитие в&nbsp;деятельности объ&shy;е&shy;ди&shy;не&shy;ния УНО&shy;ВИС. Здесь суп&shy;ре&shy;ма&shy;тизм стал не&nbsp;только ху&shy;до&shy;же&shy;ствен&shy;ным направлением, но&nbsp;и&nbsp;ос&shy;но&shy;вой кол&shy;лек&shy;тив&shy;ной работы студентов и&nbsp;преподавателей. Участники стремились применять новое ис&shy;кус&shy;ство в&nbsp;графике, ар&shy;хи&shy;тек&shy;ту&shy;ре, полиграфии и&nbsp;городской среде.' },
      { key: 'p4-bigsq',       title: 'Четвёртое измерение',                body: 'Философия К.&nbsp;С.&nbsp;Малевича о&nbsp;четвёртом измерении была связана с&nbsp;поиском нового ху&shy;до&shy;же&shy;ствен&shy;но&shy;го про&shy;стран&shy;ства. Художник стремился ос&shy;во&shy;бо&shy;дить ис&shy;кус&shy;ство от&nbsp;пред&shy;мет&shy;но&shy;го и&shy;зоб&shy;ра&shy;же&shy;ния и&nbsp;выйти за&nbsp;пределы привычной плоскости картины.' },
      { key: 'p5-cross',       title: 'Участники УНОВИСа',                  body: 'В&nbsp;состав УНО&shy;ВИ&shy;Са входили студенты и&nbsp;преподаватели Ви&shy;теб&shy;ско&shy;го на&shy;род&shy;но&shy;го ху&shy;до&shy;же&shy;ствен&shy;но&shy;го учи&shy;ли&shy;ща, которых объ&shy;е&shy;ди&shy;ня&shy;ла идея утверждения нового ис&shy;кус&shy;ства. Среди учас&shy;тни&shy;ков были К.&nbsp;С.&nbsp;Малевич, Л.&nbsp;М.&nbsp;Лисицкий, В.&nbsp;М.&nbsp;Ермолаева, И.&nbsp;Г.&nbsp;Чашник, Н.&nbsp;М.&nbsp;Суетин, Л.&nbsp;М.&nbsp;Хидекель и&nbsp;другие ху&shy;дож&shy;ни&shy;ки.' },
      { key: 'p5-reddiag',     title: 'Язык формы и цвета',                 body: 'Участники объ&shy;е&shy;ди&shy;не&shy;ния считали, что ис&shy;кус&shy;ство должно строиться не&nbsp;на&nbsp;копировании реальности, а&nbsp;на&nbsp;форме, цвете, про&shy;стран&shy;стве и&nbsp;движении. Супрематические элементы становятся способом вы&shy;ра&shy;зить идею бу&shy;ду&shy;ще&shy;го: простые ге&shy;о&shy;мет&shy;ри&shy;чес&shy;кие формы превращаются в&nbsp;знаки нового ху&shy;до&shy;же&shy;ствен&shy;но&shy;го мыш&shy;ле&shy;ния.' },
      { key: 'p6-yellow',      title: 'Лазарь Хидекель',                    body: 'Участник УНО&shy;ВИ&shy;Са, ху&shy;дож&shy;ник и&nbsp;ар&shy;хи&shy;тек&shy;тор, один из&nbsp;первых, кто начал переносить идеи суп&shy;ре&shy;ма&shy;тиз&shy;ма из&nbsp;плоскости живописи в&nbsp;про&shy;стран&shy;ство. Его работы были связаны с&nbsp;поиском новых ар&shy;хи&shy;тек&shy;тур&shy;ных форм, ос&shy;но&shy;ван&shy;ных на&nbsp;ге&shy;о&shy;мет&shy;рии, цвете и&nbsp;конструктивном мыш&shy;ле&shy;нии.' },
      { key: 'p6-redstripes',  title: 'Супрематизм в пространстве',         body: 'Супрематизм — это не&nbsp;только ху&shy;до&shy;же&shy;ствен&shy;ное направление, но&nbsp;и&nbsp;способ проектирования среды. Простые формы превращаются в&nbsp;ос&shy;но&shy;ву будущей ар&shy;хи&shy;тек&shy;ту&shy;ры, где ис&shy;кус&shy;ство выходит за&nbsp;пределы картины и&nbsp;начинает формировать про&shy;стран&shy;ство. Также это связано с&nbsp;личной историей ху&shy;дож&shy;ни&shy;ка: на&nbsp;этой улице жил сам Лазарь Хидекель.' },
      { key: 'p7-hat',         title: 'Эль Лисицкий',                       body: 'Художник, ар&shy;хи&shy;тек&shy;тор, график и&nbsp;один из&nbsp;важных пред&shy;ста&shy;ви&shy;те&shy;лей витебского аван&shy;гар&shy;да. Он&nbsp;был связан с&nbsp;Ви&shy;теб&shy;ским на&shy;род&shy;ным ху&shy;до&shy;же&shy;ствен&shy;ным учи&shy;ли&shy;щем и&nbsp;объ&shy;е&shy;ди&shy;не&shy;ни&shy;ем УНО&shy;ВИС, где развивал идеи суп&shy;ре&shy;ма&shy;тиз&shy;ма в&nbsp;графике, ти&shy;по&shy;гра&shy;фи&shy;ке, плакате и&nbsp;ар&shy;хи&shy;тек&shy;тур&shy;ном мыш&shy;ле&shy;нии.' },
      { key: 'p7-body',        title: 'Искусство в городе',                 body: 'Историческая застройка Витебска была важной частью куль&shy;тур&shy;ной жизни города начала&nbsp;XX&nbsp;века. Одно из&nbsp;таких зданий не&nbsp;сохранилось до&nbsp;наших дней, однако ранее оно было де&shy;ко&shy;ри&shy;ро&shy;ва&shy;но работами Л.&nbsp;М.&nbsp;Лисицкого. Поэтому это место сохраняет память о&nbsp;том, как идеи становились частью городской среды.' },
      { key: 'p8-yellow',      title: 'Витебск как точка нового искусства', body: 'Это город, где в&nbsp;начале XX&nbsp;века сформировалась уникальная художественная среда. Именно здесь идеи нового ис&shy;кус&shy;ства вышли за&nbsp;пределы мас&shy;тер&shy;ских и&nbsp;стали частью куль&shy;тур&shy;ной памяти города.' },
      { key: 'p8-tower',       title: 'Наследие',                           body: 'Деятельность объ&shy;е&shy;ди&shy;не&shy;ния УНО&shy;ВИ&shy;Са показала, что ис&shy;кус&shy;ство может выходить за&nbsp;пределы картины и&nbsp;становиться частью среды. Поэтому сегодня его принципы могут быть переосмыслены в&nbsp;новом формате и&nbsp;стать ос&shy;но&shy;вой сов&shy;ре&shy;мен&shy;но&shy;го визуального образа города.' },
      { key: 'p8-redsq',       title: 'Новый взгляд на город',              body: 'Маршрут помогает увидеть Витебск по-новому: как город, в&nbsp;котором ис&shy;то&shy;рия аван&shy;гар&shy;да связана с&nbsp;сов&shy;ре&shy;мен&shy;ным дизайном, ви&shy;зу&shy;аль&shy;ной коммуникацией и&nbsp;куль&shy;тур&shy;ной памятью. Наследие УНО&shy;ВИ&shy;Са становится не&nbsp;только частью прошлого, но&nbsp;и&nbsp;ос&shy;но&shy;вой для нового восприятия городской среды.<br><br><strong>Поздравляем! Вы&nbsp;прошли маршрут!</strong>' }
    ];

    // Тот же regex что в ar.html для оборачивания первого предложения p1- в lead
    function wrapLead(html) {
      const m = html.match(/^(.*?[.!?])(<br>|\s+(?=[А-Я][а-я]))([\s\S]*)$/);
      if (m) return `<span class="popup-lead">${m[1]}</span>${m[3]}`;
      return html;
    }

    // Рендерим всё в grid
    const grid = document.getElementById('grid');
    POPUPS.forEach(p => {
      const body = p.key.startsWith('p1-') ? wrapLead(p.body) : p.body;
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="label">${p.key}</div>
        <div class="popup-card">
          <button class="popup-close" aria-label="Закрыть">×</button>
          <h2 class="popup-title">${p.title}</h2>
          <div class="popup-accent"></div>
          <div class="popup-body">${body}</div>
        </div>
      `;
      grid.appendChild(item);
    });
  </script>
</body>
</html>
