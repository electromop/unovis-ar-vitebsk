<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стенд попапов · UNOVIS AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #4a4a4a;
      padding: 24px 16px 80px;
      margin: 0;
      font-family: 'Onest', system-ui, sans-serif;
      min-height: 100vh;
    }
    h1.page-title {
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 32px;
      opacity: 0.85;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 400px;
      margin: 0 auto;
    }
    .item .label {
      color: #fff;
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.6;
      margin: 0 0 8px 4px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ===== Стили попапа — копия с ar.html ===== */
    .popup-card {
      background: #FFFFFF;
      color: #111;
      padding: 28px 26px 26px;
      max-width: 360px;
      width: 100%;
      position: relative;
      border-left: 11px solid #CF1417;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      box-shadow: 8px 8px 0 rgba(216, 48, 26, 0.25);
    }
    .popup-title {
      font-family: 'Onest', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: -0.3px;
      margin: 0 0 6px;
      color: #111;
      text-transform: uppercase;
      line-height: 1.1;
      display: inline-block;
      transform: scaleX(0.82);
      transform-origin: left center;
    }
    .popup-accent {
      height: 3px;
      width: 57%;
      background: #CF1417;
      margin: 0 0 14px;
    }
    .popup-body {
      font-family: 'Onest', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.3;
      color: #1a1a1a;
      text-align: justify;
      text-wrap: pretty;
      hyphens: none;
      -webkit-hyphens: none;
      overflow-wrap: break-word;
    }
    .popup-body .popup-lead {
      display: block;
      margin-bottom: 0.25em;
    }
    .popup-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #111;
      line-height: 1;
      padding: 4px 10px;
    }
  </style>
</head>
<body>

  <h1 class="page-title">Стенд попапов · 18 уникальных текстов</h1>
  <div class="grid" id="grid"></div>

  <script>
    // ====== Та же дата что в ar.html ======
    const POPUPS = [
      { key: 'p1-stripes',     title: 'Витебск',                            body: 'Витебск — один из&nbsp;старейших городов Республики Беларусь, расположенный на&nbsp;реке Западная Двина. Город обладает богатым наследием и&nbsp;занимает важное место в&nbsp;истории искусства начала&nbsp;XX&nbsp;века.' },
      { key: 'p1-blacksq',     title: 'К. С. Малевич',                      body: 'Основатель супрематизма и&nbsp;идейный лидер УНОВИСа.<br>«Чёрный квадрат» — символ нового искусства, где простая форма заменяет предмет и&nbsp;открывает путь к&nbsp;свободному видению.' },
      { key: 'p1-stairs',      title: 'Набережная города',                  body: 'Красные элементы являются символом движения и&nbsp;перехода от&nbsp;реального пространства к&nbsp;маршруту нового искусства. Также это отсылает к&nbsp;лестнице на&nbsp;набережной города.' },
      { key: 'p2-blacksq',     title: 'УНОВИС',                             body: '«Утвердители нового искусства». Объединение возникло в&nbsp;Витебске в&nbsp;1920&nbsp;году вокруг идей К.&nbsp;С.&nbsp;Малевича. Поиск нового языка — через форму, цвет, пространство и&nbsp;отказ от&nbsp;традиционной живописи.' },
      { key: 'p2-greenline',   title: 'Супрематизм',                        body: 'Искусство чистых форм и&nbsp;цвета. Отказ от&nbsp;традиционной живописи. Идея — через простые формы, движение и&nbsp;пространство.' },
      { key: 'p2-redshape',    title: 'Роспись на здании',                  body: '«Стена Малевича» создана по&nbsp;эскизу Малевича «Принцип росписи стены по&nbsp;системе супрематизма», известному как «Смерть обоям». Художник вынес супрематизм за&nbsp;пределы холста — в&nbsp;реальное пространство. Главная идея авангарда: искусство живёт не&nbsp;только в&nbsp;картине.' },
      { key: 'p3-moon',        title: 'Марк Шагал',                         body: 'Один из&nbsp;главных символов Витебска. Его творчество — об&nbsp;образе города, памяти, движении и&nbsp;личном переживании.' },
      { key: 'p3-house',       title: 'ВНХУ',                               body: 'Марк Шагал основал Витебское народное художественное училище (ВНХУ) — важную точку развития авангарда. В&nbsp;этой среде позднее возникло объединение УНОВИС.' },
      { key: 'p4-malevich',    title: 'Идеи К. С. Малевича',                body: 'В&nbsp;Витебске идеи художника развили в&nbsp;объединении УНОВИС. Супрематизм стал не&nbsp;только искусством, но&nbsp;и&nbsp;основой коллективной работы. Участники применяли его в&nbsp;графике, архитектуре, плакате и&nbsp;городской среде.' },
      { key: 'p4-bigsq',       title: 'Четвёртое измерение',                body: 'Философия Малевича о&nbsp;четвёртом измерении — поиск нового пространства искусства. Освобождение от&nbsp;предмета и&nbsp;выход за&nbsp;пределы плоской картины.' },
      { key: 'p5-cross',       title: 'Участники УНОВИСа',                  body: 'В&nbsp;УНОВИС входили студенты и&nbsp;преподаватели ВНХУ, объединённые идеей нового искусства. Среди них К.&nbsp;С.&nbsp;Малевич, Л.&nbsp;М.&nbsp;Лисицкий, В.&nbsp;М.&nbsp;Ермолаева, И.&nbsp;Г.&nbsp;Чашник, Н.&nbsp;М.&nbsp;Суетин, Л.&nbsp;М.&nbsp;Хидекель и&nbsp;другие.' },
      { key: 'p5-reddiag',     title: 'Язык формы и цвета',                 body: 'Участники считали: искусство строится не&nbsp;на&nbsp;копировании реальности, а&nbsp;на&nbsp;форме, цвете, пространстве и&nbsp;движении. Простые формы — способ выразить будущее, знаки нового мышления.' },
      { key: 'p6-yellow',      title: 'Лазарь Хидекель',                    body: 'Участник УНОВИСа, художник и&nbsp;архитектор. Один из&nbsp;первых, кто перенёс идеи супрематизма из&nbsp;живописи в&nbsp;пространство. Искал новые архитектурные формы — на&nbsp;геометрии, цвете и&nbsp;конструкции.' },
      { key: 'p6-redstripes',  title: 'Супрематизм в пространстве',         body: 'Супрематизм — не&nbsp;только направление в&nbsp;искусстве, но&nbsp;и&nbsp;способ проектировать среду. Простые формы становятся основой архитектуры. Также это личная история: на&nbsp;этой улице жил сам Лазарь Хидекель.' },
      { key: 'p7-hat',         title: 'Эль Лисицкий',                       body: 'Художник, архитектор, график. Один из&nbsp;ключевых представителей витебского авангарда. Был связан с&nbsp;ВНХУ и&nbsp;УНОВИСом, где развивал идеи супрематизма в&nbsp;графике, типографике, плакате и&nbsp;архитектуре.' },
      { key: 'p7-body',        title: 'Искусство в городе',                 body: 'Историческая застройка Витебска — важная часть культурной жизни города начала&nbsp;XX&nbsp;века. Одно из&nbsp;зданий не&nbsp;сохранилось, но&nbsp;его украшали работы Л.&nbsp;М.&nbsp;Лисицкого. Место хранит память о&nbsp;том, как искусство становилось частью города.' },
      { key: 'p8-yellow',      title: 'Витебск как точка нового искусства', body: 'Город, где в&nbsp;начале XX&nbsp;века сложилась уникальная художественная среда. Здесь идеи нового искусства вышли за&nbsp;пределы мастерских и&nbsp;стали частью памяти города.' },
      { key: 'p8-tower',       title: 'Наследие',                           body: 'УНОВИС показал: искусство может выходить за&nbsp;пределы картины и&nbsp;становиться частью среды. Сегодня его принципы можно переосмыслить как основу нового образа города.' },
      { key: 'p8-redsq',       title: 'Новый взгляд на город',              body: 'Маршрут открывает Витебск по-новому: город, где история авангарда живёт в&nbsp;современном дизайне и&nbsp;памяти. Наследие УНОВИСа — не&nbsp;только прошлое, но&nbsp;и&nbsp;основа нового образа города.<br><br><strong>Поздравляем! Вы&nbsp;прошли маршрут!</strong>' }
    ];

    // Тот же regex что в ar.html для оборачивания первого предложения p1- в lead
    function wrapLead(html) {
      const m = html.match(/^(.*?[.!?])(<br>|\s+(?=[А-Я][а-я]))([\s\S]*)$/);
      if (m) return `<span class="popup-lead">${m[1]}</span>${m[3]}`;
      return html;
    }

    // Рендерим всё в grid
    const grid = document.getElementById('grid');
    POPUPS.forEach(p => {
      const body = p.key.startsWith('p1-') ? wrapLead(p.body) : p.body;
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="label">${p.key}</div>
        <div class="popup-card">
          <button class="popup-close" aria-label="Закрыть">×</button>
          <h2 class="popup-title">${p.title}</h2>
          <div class="popup-accent"></div>
          <div class="popup-body">${body}</div>
        </div>
      `;
      grid.appendChild(item);
    });
  </script>
</body>
</html>
