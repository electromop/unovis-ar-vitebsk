<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Стенд попапов · UNOVIS AR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #4a4a4a;
      padding: 24px 16px 80px;
      margin: 0;
      font-family: 'Onest', system-ui, sans-serif;
      min-height: 100vh;
    }
    h1.page-title {
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      margin: 0 0 32px;
      opacity: 0.85;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 400px;
      margin: 0 auto;
    }
    .item .label {
      color: #fff;
      font-size: 11px;
      letter-spacing: 1.5px;
      opacity: 0.6;
      margin: 0 0 8px 4px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ===== Стили попапа — копия с ar.html ===== */
    .popup-card {
      background: #FFFFFF;
      color: #111;
      padding: 28px 26px 26px;
      max-width: 360px;
      width: 100%;
      position: relative;
      border-left: 11px solid #CF1417;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      box-shadow: 8px 8px 0 rgba(216, 48, 26, 0.25);
    }
    .popup-title {
      font-family: 'Onest', system-ui, sans-serif;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: -0.3px;
      margin: 0 0 6px;
      color: #111;
      text-transform: uppercase;
      line-height: 1.1;
      display: inline-block;
      transform: scaleX(0.82);
      transform-origin: left center;
    }
    .popup-accent {
      height: 3px;
      width: 57%;
      background: #CF1417;
      margin: 0 0 14px;
    }
    .popup-body {
      font-family: 'Onest', system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.3;
      color: #1a1a1a;
      text-align: left;
      text-wrap: pretty;
      hyphens: none;
      -webkit-hyphens: none;
      overflow-wrap: break-word;
    }
    .popup-body .popup-lead {
      display: block;
      margin-bottom: 0.25em;
    }
    .popup-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #111;
      line-height: 1;
      padding: 4px 10px;
    }
  </style>
</head>
<body>

  <h1 class="page-title">Стенд попапов · 18 уникальных текстов</h1>
  <div class="grid" id="grid"></div>

  <script>
    // ====== Та же дата что в ar.html ======
    const POPUPS = [
      { key: 'p1-stripes',     title: 'Витебск',                            body: 'Витебск — один из&nbsp;старейших городов Республики Беларусь, расположенный на&nbsp;реке Западная Двина. Город обладает богатым наследием и&nbsp;занимает важное место в&nbsp;истории искусства начала&nbsp;XX&nbsp;века.' },
      { key: 'p1-blacksq',     title: 'К. С. Малевич',                      body: 'Основатель супрематизма и&nbsp;идейный лидер УНОВИСа.<br>Его работа «Чёрный квадрат» стала символом нового искусства, в&nbsp;котором простая геометрическая форма заменяет предметное изображение и&nbsp;открывает путь к&nbsp;свободному визуальному мышлению.' },
      { key: 'p1-stairs',      title: 'Набережная города',                  body: 'Красные элементы являются символом движения и&nbsp;перехода от&nbsp;реального пространства к&nbsp;маршруту нового искусства. Также это отсылает к&nbsp;лестнице на&nbsp;набережной города.' },
      { key: 'p2-blacksq',     title: 'УНОВИС',                             body: '«Утвердители нового искусства». Объединение возникло в&nbsp;Витебске в&nbsp;1920&nbsp;году и&nbsp;было связано с&nbsp;идеями К.&nbsp;С.&nbsp;Малевича, супрематизма и&nbsp;поиском нового художественного языка, основанного на&nbsp;форме, цвете, пространстве и&nbsp;отказе от&nbsp;традиционного изображения.' },
      { key: 'p2-greenline',   title: 'Супрематизм',                        body: 'Это искусство чистых форм и&nbsp;цвета. Он&nbsp;отказывается от&nbsp;изображения традиционной живописи и&nbsp;передаёт идею через геометрические формы, движение и&nbsp;пространство.' },
      { key: 'p2-redshape',    title: 'Роспись на здании',                  body: '«Стена Малевича» создана по&nbsp;эскизу К.&nbsp;С.&nbsp;Малевича «Принцип росписи стены, плоскости или&nbsp;всей комнаты, или&nbsp;целой квартиры по&nbsp;системе супрематизма», также известному под названием «Смерть обоям». В&nbsp;этой работе художник предложил перенести супрематические формы за&nbsp;пределы холста и&nbsp;отражает одну из&nbsp;главных идей авангарда: искусство может существовать не&nbsp;только в&nbsp;картине, но&nbsp;и&nbsp;в&nbsp;реальной среде.' },
      { key: 'p3-moon',        title: 'Марк Шагал',                         body: 'Один из&nbsp;главных художественных символов Витебска. Его творчество связано с&nbsp;образом города, памятью, движением и&nbsp;личным восприятием пространства.' },
      { key: 'p3-house',       title: 'ВНХУ',                               body: 'Марк Шагал основал Витебское народное художественное училище (ВНХУ), ставшее важной точкой развития авангарда. Именно в&nbsp;этой художественной среде позднее возникло объединение УНОВИС.' },
      { key: 'p4-malevich',    title: 'Идеи К. С. Малевича',                body: 'В&nbsp;Витебске идеи художника получили развитие в&nbsp;деятельности объединения УНОВИС. Здесь супрематизм стал не&nbsp;только художественным направлением, но&nbsp;и&nbsp;основой коллективной работы студентов и&nbsp;преподавателей. Участники стремились применять новое искусство в&nbsp;графике, архитектуре, полиграфии и&nbsp;городской среде.' },
      { key: 'p4-bigsq',       title: 'Четвёртое измерение',                body: 'Философия К.&nbsp;С.&nbsp;Малевича о&nbsp;четвёртом измерении была связана с&nbsp;поиском нового художественного пространства. Художник стремился освободить искусство от&nbsp;предметного изображения и&nbsp;выйти за&nbsp;пределы привычной плоскости картины.' },
      { key: 'p5-cross',       title: 'Участники УНОВИСа',                  body: 'В&nbsp;состав УНОВИСа входили студенты и&nbsp;преподаватели Витебского народного художественного училища, которых объединяла идея утверждения нового искусства. Среди участников были К.&nbsp;С.&nbsp;Малевич, Л.&nbsp;М.&nbsp;Лисицкий, В.&nbsp;М.&nbsp;Ермолаева, И.&nbsp;Г.&nbsp;Чашник, Н.&nbsp;М.&nbsp;Суетин, Л.&nbsp;М.&nbsp;Хидекель и&nbsp;другие художники.' },
      { key: 'p5-reddiag',     title: 'Язык формы и цвета',                 body: 'Участники объединения считали, что искусство должно строиться не&nbsp;на&nbsp;копировании реальности, а&nbsp;на&nbsp;форме, цвете, пространстве и&nbsp;движении. Супрематические элементы становятся способом выразить идею будущего: простые геометрические формы превращаются в&nbsp;знаки нового художественного мышления.' },
      { key: 'p6-yellow',      title: 'Лазарь Хидекель',                    body: 'Участник УНОВИСа, художник и&nbsp;архитектор, один из&nbsp;первых, кто начал переносить идеи супрематизма из&nbsp;плоскости живописи в&nbsp;пространство. Его работы были связаны с&nbsp;поиском новых архитектурных форм, основанных на&nbsp;геометрии, цвете и&nbsp;конструктивном мышлении.' },
      { key: 'p6-redstripes',  title: 'Супрематизм в пространстве',         body: 'Супрематизм — это не&nbsp;только художественное направление, но&nbsp;и&nbsp;способ проектирования среды. Простые формы превращаются в&nbsp;основу будущей архитектуры, где искусство выходит за&nbsp;пределы картины и&nbsp;начинает формировать пространство. Также это связано с&nbsp;личной историей художника: на&nbsp;этой улице жил сам Лазарь Хидекель.' },
      { key: 'p7-hat',         title: 'Эль Лисицкий',                       body: 'Художник, архитектор, график и&nbsp;один из&nbsp;важных представителей витебского авангарда. Он&nbsp;был связан с&nbsp;Витебским народным художественным училищем и&nbsp;объединением УНОВИС, где развивал идеи супрематизма в&nbsp;графике, типографике, плакате и&nbsp;архитектурном мышлении.' },
      { key: 'p7-body',        title: 'Искусство в городе',                 body: 'Историческая застройка Витебска была важной частью культурной жизни города начала&nbsp;XX&nbsp;века. Одно из&nbsp;таких зданий не&nbsp;сохранилось до&nbsp;наших дней, однако ранее оно было декорировано работами Л.&nbsp;М.&nbsp;Лисицкого. Поэтому это место сохраняет память о&nbsp;том, как идеи становились частью городской среды.' },
      { key: 'p8-yellow',      title: 'Витебск как точка нового искусства', body: 'Это город, где в&nbsp;начале XX&nbsp;века сформировалась уникальная художественная среда. Именно здесь идеи нового искусства вышли за&nbsp;пределы мастерских и&nbsp;стали частью культурной памяти города.' },
      { key: 'p8-tower',       title: 'Наследие',                           body: 'Деятельность объединения УНОВИСа показала, что искусство может выходить за&nbsp;пределы картины и&nbsp;становиться частью среды. Поэтому сегодня его принципы могут быть переосмыслены в&nbsp;новом формате и&nbsp;стать основой современного визуального образа города.' },
      { key: 'p8-redsq',       title: 'Новый взгляд на город',              body: 'Маршрут помогает увидеть Витебск по-новому: как город, в&nbsp;котором история авангарда связана с&nbsp;современным дизайном, визуальной коммуникацией и&nbsp;культурной памятью. Наследие УНОВИСа становится не&nbsp;только частью прошлого, но&nbsp;и&nbsp;основой для нового восприятия городской среды.<br><br><strong>Поздравляем! Вы&nbsp;прошли маршрут!</strong>' }
    ];

    // Тот же regex что в ar.html для оборачивания первого предложения p1- в lead
    function wrapLead(html) {
      const m = html.match(/^(.*?[.!?])(<br>|\s+(?=[А-Я][а-я]))([\s\S]*)$/);
      if (m) return `<span class="popup-lead">${m[1]}</span>${m[3]}`;
      return html;
    }

    // Рендерим всё в grid
    const grid = document.getElementById('grid');
    POPUPS.forEach(p => {
      const body = p.key.startsWith('p1-') ? wrapLead(p.body) : p.body;
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="label">${p.key}</div>
        <div class="popup-card">
          <button class="popup-close" aria-label="Закрыть">×</button>
          <h2 class="popup-title">${p.title}</h2>
          <div class="popup-accent"></div>
          <div class="popup-body">${body}</div>
        </div>
      `;
      grid.appendChild(item);
    });
  </script>
</body>
</html>
