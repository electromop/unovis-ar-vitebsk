<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>УНОВИС × Витебск — AR</title>

  <!-- Onest для UI-надписей. Шрифт уже в кеше после визита на лендинг → +0ms. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap">

  <!-- Синхронная загрузка — критично для iOS Safari: с defer ломается user-gesture
       window для getUserMedia после клика на лендинге, камера не запрашивается. -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    /* HTML — тёмный фон. На <body> background НЕ ставим — там через
       z-index: -2 лежит <video> с камерой, body должен быть прозрачным.
       Тёмный фон html виден только когда камера ещё не отдаёт кадры
       (или эмулятор без камеры), вместо браузерного белого. */
    html {
      background: #090910;
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: 'Courier New', monospace;
      color: #FFFFFF;
    }

    /* Оверлеи поверх AR-сцены */
    #start-screen, #scan-hint, #detected-banner {
      z-index: 9999;
    }

    /* ===== Глушим встроенные оверлеи A-Frame и MindAR =====
       Голубой фон с тремя белыми точками — это loading-screen A-Frame
       (background #24CAFF + dots). Гасим атрибутом + CSS для надёжности.
       MindAR's UI (uiLoading/uiScanning/uiError) — аналогично. */
    .a-loader-title,
    .mindar-ui-overlay,
    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-compatibility,
    .mindar-ui-error {
      display: none !important;
    }
    /* ===== Loading splash — виден сразу при загрузке страницы =====
       Не зависит от A-Frame/MindAR (они грузятся defer). Прячется при arReady. */
    #ar-loading {
      position: fixed;
      inset: 0;
      background: #090910;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      transition: opacity 0.3s ease;
    }
    #ar-loading.hidden { opacity: 0; pointer-events: none; }
    .ar-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #CF1417;
      border-radius: 50%;
      animation: ar-spin 0.85s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes ar-spin { to { transform: rotate(360deg); } }
    #ar-loading p {
      font-size: 14px;
      opacity: 0.85;
      letter-spacing: 0.4px;
      margin: 0;
      text-align: center;
      max-width: 280px;
      padding: 0 24px;
      line-height: 1.5;
      transition: opacity 0.45s ease;
      min-height: 22px;             /* фиксированный высотой блок чтобы не дёргался при смене текста */
    }
    #ar-loading p.fading {
      opacity: 0;
    }

    /* Стартовый экран */
    #start-screen {
      position: fixed; inset: 0;
      background: #090910;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 32px;
      text-align: center;
    }
    #start-screen h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 56px;
      margin: 0 0 8px;
      letter-spacing: 4px;
      color: #FFFFFF;
    }
    #start-screen .accent { color: #CF1417; }
    #start-screen .sub {
      font-size: 13px;
      letter-spacing: 6px;
      opacity: 0.7;
      margin-bottom: 40px;
    }
    #start-screen p {
      font-size: 15px;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 0 32px;
      opacity: 0.85;
    }
    #start-btn {
      background: #CF1417;
      color: #FFFFFF;
      border: none;
      padding: 18px 42px;
      font-family: Impact, sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 0;
    }
    #start-btn:active { transform: translate(2px, 2px); }

    /* Полоски-акценты */
    .stripes {
      position: absolute;
      top: 24px; right: 24px;
      display: flex; gap: 6px;
    }
    .stripes div { width: 22px; height: 22px; }
    .s1 { background: #090910; border: 1px solid #FFFFFF; }
    .s2 { background: #CF1417; }
    .s3 { background: #2D2C7F; }

    /* Подсказка сканирования */
    #scan-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 9, 16, 0.78);
      color: #FFFFFF;
      padding: 10px 16px;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.3px;
      line-height: 1.4;
      text-align: center;
      border-left: 3px solid #CF1417;
      z-index: 500;
      display: none;
      max-width: calc(100% - 48px);
      white-space: nowrap;
    }
    #scan-hint .hint-sub {
      display: block;
      margin-top: 3px;
      font-weight: 400;
      font-size: 10px;
      opacity: 0.65;
    }

    /* Статус при обнаружении */
    #detected-banner {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #CF1417;
      color: #FFFFFF;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 3px;
      z-index: 500;
      display: none;
    }

    /* Информационный поп-ап при клике на фигуру */
    #info-popup {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #info-popup.active {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-card {
      background: #FFFFFF;
      color: #111;
      padding: 34px 28px 28px;
      max-width: 360px;
      width: 100%;
      position: relative;
      border-left: 6px solid #CF1417;
      font-family: 'Courier New', monospace;
      box-shadow: 8px 8px 0 rgba(216, 48, 26, 0.25);
      transform: translateY(12px);
      transition: transform 0.3s ease;
    }
    #info-popup.active .popup-card {
      transform: translateY(0);
    }
    .popup-accent {
      height: 4px;
      width: 42px;
      background: #CF1417;
      margin-bottom: 14px;
    }
    .popup-title {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      margin: 0 0 14px;
      color: #111;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .popup-body {
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: 0.3px;
      color: #1a1a1a;
    }
    .popup-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 32px;
      font-family: Impact, sans-serif;
      cursor: pointer;
      color: #111;
      line-height: 1;
      padding: 4px 10px;
    }
    .popup-close:active {
      transform: translate(1px, 1px);
    }

  </style>
</head>
<body>

  <!-- Loading splash — показывается сразу при заходе на страницу,
       прячется когда MindAR прогревается (arReady) или по таймауту-страховке.
       Сообщения внутри циклично сменяются (см. JS ниже). -->
  <div id="ar-loading" aria-hidden="false">
    <div class="ar-spinner"></div>
    <p id="loading-msg">Подгружаем авангард</p>
  </div>

  <!-- Старт -->
  <div id="start-screen">
    <div class="stripes"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>
    <h1>УНОВИС<span class="accent">.</span></h1>
    <div class="sub">ВИТЕБСК · 1919—1922</div>
    <p>Наведи камеру на плакат<br>и увидишь, как супрематизм оживает<br>спустя 100 лет.</p>
    <button id="start-btn">НАЧАТЬ AR →</button>
    <p style="font-size:11px; opacity:0.5; margin-top:32px; letter-spacing:2px;">
      Требуется доступ к камере<br>Работает в Safari / Chrome на телефоне
    </p>
  </div>

  <div id="scan-hint">
    Наведите&nbsp;камеру на&nbsp;плакат
    <span class="hint-sub">Нажмите на&nbsp;фигуру</span>
  </div>
  <div id="detected-banner">● AR АКТИВЕН</div>

  <!-- Информационный поп-ап -->
  <div id="info-popup" aria-hidden="true">
    <div class="popup-card">
      <button class="popup-close" aria-label="Закрыть">×</button>
      <div class="popup-accent"></div>
      <h2 class="popup-title"></h2>
      <div class="popup-body"></div>
    </div>
  </div>

  <!-- A-Frame сцена с MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.00001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
    loading-screen="enabled: false"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Локальные ресурсы можно положить сюда -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">
      <!-- Курсор на основе тапа по экрану -->
      <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 20;"></a-entity>
    </a-camera>

    <!-- Свет — принудительно, чтобы материалы светились одинаково с любых углов -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 1 1"></a-entity>

    <!-- ============================================================ -->
    <!-- Цель 0: ПЛАКАТ 1 (poster1.svg) — оверлей оживляет плакат     -->
    <!-- Все фигуры наклонены на +11° (как в SVG), едва дрейфуют      -->
    <!-- и дышат. AR-плоскости лежат поверх своих "печатных" версий.  -->
    <!-- ============================================================ -->
    <!-- Координаты MindAR: width=1 → X∈[-0.5;0.5]; aspect 595×842 →  -->
    <!-- height=1.414 → Y∈[-0.707;+0.707]. Y растёт ВВЕРХ.            -->
    <!-- Перевод из SVG: mindar_x=(svg_cx-297.64)/595.28               -->
    <!--                 mindar_y=(420.95-svg_cy)/595.28               -->
    <!--                 size = svg_size / 595.28                       -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-1">

      <!-- Большой красный прямоугольник (верх) — поверх фразы "ПРОЕКТ КЕЙС" -->
      <a-plane
        class="clickable" data-info="p1-red-squares"
        position="-0.188 0.310 0.03"
        width="0.439" height="0.229"
        rotation="0 0 -11"
        material="shader: flat; color: #CE1417; side: double"
        animation__breathe="property: scale; from: 0.985 0.985 1; to: 1.015 1.015 1; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__drift="property: position; from: -0.193 0.307 0.03; to: -0.183 0.313 0.03; dir: alternate; loop: true; dur: 6400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Маленький чёрный квадрат верх-лево (под угловой меткой) -->
      <a-plane
        class="clickable" data-info="p1-black-square"
        position="-0.277 0.445 0.03"
        width="0.077" height="0.077"
        rotation="0 0 -11"
        material="shader: flat; color: #090910; side: double"
        animation__breathe="property: scale; from: 0.95 0.95 1; to: 1.05 1.05 1; dir: alternate; loop: true; dur: 3600; easing: easeInOutSine"
        animation__drift="property: position; from: -0.280 0.442 0.03; to: -0.274 0.448 0.03; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 200; easing: easeOutCubic">
      </a-plane>

      <!-- Чёрная горизонтальная полоса (тонкая, длинная) — над лестницей квадратов -->
      <a-plane
        class="clickable" data-info="p1-lines"
        position="0.046 0.098 0.03"
        width="0.677" height="0.023"
        rotation="0 0 -11"
        material="shader: flat; color: #090910; side: double"
        animation__drift="property: position; from: 0.038 0.094 0.03; to: 0.054 0.102 0.03; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.98 1 1; to: 1.02 1 1; dir: alternate; loop: true; dur: 4400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 350; easing: easeOutCubic">
      </a-plane>

      <!-- Красный квадрат 1 — первая ступень "лестницы" -->
      <a-plane
        class="clickable" data-info="p1-red-squares"
        position="-0.042 -0.005 0.04"
        width="0.143" height="0.143"
        rotation="0 0 -11"
        material="shader: flat; color: #CE1417; side: double"
        animation__breathe="property: scale; from: 0.96 0.96 1; to: 1.05 1.05 1; dir: alternate; loop: true; dur: 3400; easing: easeInOutSine"
        animation__drift="property: position; from: -0.048 -0.011 0.04; to: -0.036 0.001 0.04; dir: alternate; loop: true; dur: 5200; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 -14; to: 0 0 -8; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 500; easing: easeOutCubic">
      </a-plane>

      <!-- Красный квадрат 2 — вторая ступень -->
      <a-plane
        class="clickable" data-info="p1-red-squares"
        position="0.092 -0.196 0.04"
        width="0.143" height="0.143"
        rotation="0 0 -11"
        material="shader: flat; color: #CE1417; side: double"
        animation__breathe="property: scale; from: 0.96 0.96 1; to: 1.05 1.05 1; dir: alternate; loop: true; dur: 3600; delay: 400; easing: easeInOutSine"
        animation__drift="property: position; from: 0.086 -0.202 0.04; to: 0.098 -0.190 0.04; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 -14; to: 0 0 -8; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 700; easing: easeOutCubic">
      </a-plane>

      <!-- Красный квадрат 3 — третья ступень -->
      <a-plane
        class="clickable" data-info="p1-red-squares"
        position="0.228 -0.393 0.04"
        width="0.143" height="0.143"
        rotation="0 0 -11"
        material="shader: flat; color: #CE1417; side: double"
        animation__breathe="property: scale; from: 0.96 0.96 1; to: 1.05 1.05 1; dir: alternate; loop: true; dur: 3800; delay: 800; easing: easeInOutSine"
        animation__drift="property: position; from: 0.222 -0.399 0.04; to: 0.234 -0.387 0.04; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 -14; to: 0 0 -8; dir: alternate; loop: true; dur: 6200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Чёрные полосы вокруг лестницы — двойная пара слева, двойная пара справа -->
      <a-plane
        class="clickable" data-info="p1-lines"
        position="-0.346 -0.088 0.02"
        width="0.698" height="0.023"
        rotation="0 0 -11"
        material="shader: flat; color: #090910; side: double"
        animation__drift="property: position; from: -0.352 -0.090 0.02; to: -0.340 -0.086 0.02; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.98 1 1; to: 1.02 1 1; dir: alternate; loop: true; dur: 4600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 1100; easing: easeOutCubic">
      </a-plane>
      <a-plane
        class="clickable" data-info="p1-lines"
        position="-0.355 -0.133 0.02"
        width="0.698" height="0.023"
        rotation="0 0 -11"
        material="shader: flat; color: #090910; side: double"
        animation__drift="property: position; from: -0.361 -0.135 0.02; to: -0.349 -0.131 0.02; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.98 1 1; to: 1.02 1 1; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 1300; easing: easeOutCubic">
      </a-plane>
      <a-plane
        class="clickable" data-info="p1-lines"
        position="-0.216 -0.287 0.02"
        width="0.698" height="0.023"
        rotation="0 0 -11"
        material="shader: flat; color: #090910; side: double"
        animation__drift="property: position; from: -0.222 -0.289 0.02; to: -0.210 -0.285 0.02; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.98 1 1; to: 1.02 1 1; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 1500; easing: easeOutCubic">
      </a-plane>
      <a-plane
        class="clickable" data-info="p1-lines"
        position="-0.223 -0.332 0.02"
        width="0.698" height="0.023"
        rotation="0 0 -11"
        material="shader: flat; color: #090910; side: double"
        animation__drift="property: position; from: -0.229 -0.334 0.02; to: -0.217 -0.330 0.02; dir: alternate; loop: true; dur: 6200; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.98 1 1; to: 1.02 1 1; dir: alternate; loop: true; dur: 5200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 1700; easing: easeOutCubic">
      </a-plane>

    </a-entity>

    <!-- ============================================================ -->
    <!-- Цель 1: ПЛАКАТ 2 (poster2.svg) — оверлей                    -->
    <!-- Чёрный квадрат + жёлтые блоки + диагонали (зелёная, синяя)  -->
    <!-- + большой красный круг внизу-слева                           -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-2">

      <!-- Большой чёрный квадрат справа-сверху (главный блок плаката) -->
      <a-plane
        class="clickable" data-info="p2-black-square"
        position="0.243 0.154 0.03"
        width="0.390" height="0.390"
        material="shader: flat; color: #090910; side: double"
        animation__breathe="property: scale; from: 0.985 0.985 1; to: 1.015 1.015 1; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__drift="property: position; from: 0.239 0.151 0.03; to: 0.247 0.157 0.03; dir: alternate; loop: true; dur: 6200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutCubic">
      </a-plane>

      <!-- Жёлтый блок снизу (горизонтальный) — без текста, некликабельный -->
      <a-plane
        position="0.093 -0.456 0.03"
        width="0.296" height="0.108"
        material="shader: flat; color: #ECC105; side: double"
        animation__breathe="property: scale; from: 0.98 0.98 1; to: 1.02 1.02 1; dir: alternate; loop: true; dur: 4200; easing: easeInOutSine"
        animation__drift="property: position; from: 0.088 -0.459 0.03; to: 0.098 -0.453 0.03; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 300; easing: easeOutCubic">
      </a-plane>

      <!-- Жёлтый вертикальный блок верх-середина — без текста, некликабельный -->
      <a-plane
        position="-0.041 0.565 0.03"
        width="0.091" height="0.284"
        material="shader: flat; color: #ECC105; side: double"
        animation__breathe="property: scale; from: 0.98 0.98 1; to: 1.02 1.02 1; dir: alternate; loop: true; dur: 4400; delay: 600; easing: easeInOutSine"
        animation__drift="property: position; from: -0.044 0.562 0.03; to: -0.038 0.568 0.03; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 500; easing: easeOutCubic">
      </a-plane>

      <!-- Жёлтый малый блок верх-право — без текста, некликабельный -->
      <a-plane
        position="0.429 0.644 0.03"
        width="0.142" height="0.127"
        material="shader: flat; color: #ECC105; side: double"
        animation__breathe="property: scale; from: 0.97 0.97 1; to: 1.03 1.03 1; dir: alternate; loop: true; dur: 4000; delay: 900; easing: easeInOutSine"
        animation__drift="property: position; from: 0.425 0.641 0.03; to: 0.433 0.647 0.03; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 700; easing: easeOutCubic">
      </a-plane>

      <!-- Зелёная диагональ (наклон +39°) -->
      <a-plane
        class="clickable" data-info="p2-lines"
        position="-0.189 -0.027 0.04"
        width="0.415" height="0.032"
        rotation="0 0 39"
        material="shader: flat; color: #0D803C; side: double"
        animation__drift="property: position; from: -0.193 -0.030 0.04; to: -0.185 -0.024 0.04; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 37; to: 0 0 41; dir: alternate; loop: true; dur: 6800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1100; delay: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Синяя диагональ — параллельна зелёной, чуть ниже-левее -->
      <a-plane
        class="clickable" data-info="p2-lines"
        position="-0.220 -0.093 0.04"
        width="0.415" height="0.032"
        rotation="0 0 39"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__drift="property: position; from: -0.224 -0.096 0.04; to: -0.216 -0.090 0.04; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 37; to: 0 0 41; dir: alternate; loop: true; dur: 7000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1100; delay: 1100; easing: easeOutCubic">
      </a-plane>

      <!-- Большой красный круг низ-лево (центр частично за пределами плаката) -->
      <a-circle
        class="clickable" data-info="p2-red-shape"
        position="-0.464 -0.600 0.03"
        radius="0.303"
        material="shader: flat; color: #CE1417; side: double"
        animation__breathe="property: scale; from: 0.985 0.985 1; to: 1.02 1.02 1; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
        animation__drift="property: position; from: -0.470 -0.604 0.03; to: -0.458 -0.596 0.03; dir: alternate; loop: true; dur: 6400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; delay: 1300; easing: easeOutCubic">
      </a-circle>

    </a-entity>

    <!-- ============================================================ -->
    <!-- Цель 2: ПЛАКАТ 3 (poster3.svg) — фигура Шагала "шагает"     -->
    <!-- Голова (жёлтый круг) покачивается, ножка раскачивается      -->
    <!-- Диагонали и малый квадрат — фон (не кликабельны)            -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-3">

      <!-- Зелёная диагональ (верхняя) — фон -->
      <a-plane
        position="0.104 0.330 0.02"
        width="0.503" height="0.046"
        rotation="0 0 39"
        material="shader: flat; color: #0D803C; side: double"
        animation__drift="property: position; from: 0.100 0.327 0.02; to: 0.108 0.333 0.02; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1100; easing: easeOutCubic">
      </a-plane>

      <!-- Синяя диагональ (нижняя) — фон -->
      <a-plane
        position="0.070 0.242 0.02"
        width="0.513" height="0.046"
        rotation="0 0 39"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__drift="property: position; from: 0.066 0.239 0.02; to: 0.074 0.245 0.02; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1100; delay: 300; easing: easeOutCubic">
      </a-plane>

      <!-- Малый чёрный квадрат — фон -->
      <a-plane
        position="0.262 -0.018 0.02"
        width="0.085" height="0.085"
        material="shader: flat; color: #090910; side: double"
        animation__breathe="property: scale; from: 0.97 0.97 1; to: 1.03 1.03 1; dir: alternate; loop: true; dur: 4200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 600; easing: easeOutCubic">
      </a-plane>

      <!-- ===== Шагающий Шагал ===== -->
      <!-- Голова (жёлтый круг), центр (415, 395) в SVG → (0.197, 0.044) в MindAR.
           Покачивается вверх-вниз в такт шагу. -->
      <a-circle
        class="clickable" data-info="p3-head"
        position="0.197 0.044 0.06"
        radius="0.067"
        material="shader: flat; color: #ECC105; side: double"
        animation__bob="property: position; from: 0.197 0.038 0.06; to: 0.197 0.052 0.06; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.97 0.97 1; to: 1.03 1.03 1; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutCubic">
      </a-circle>

      <!-- Ножка (чёрная "штанина"-трапеция).
           Полигон в SVG: (230.85,742.36) (230.85,483.56) (143.6,483.56) (112.81,742.36)
           Центр ≈ (179, 612.5), высота 258, ширина ≈ 103.
           MindAR: x=-0.199, y=-0.322, w=0.173, h=0.434.
           Pivot для свинга задаётся через transformOrigin родителя.
           Чтобы нога качалась "от бедра" (верх), вкладываю plane в entity
           и смещаю plane вниз на h/2 — точка вращения окажется наверху. -->
      <a-entity
        position="-0.199 -0.105 0.05"
        animation__step="property: rotation; from: 0 0 -10; to: 0 0 10; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 400; easing: easeOutCubic">
        <a-plane
          class="clickable" data-info="p3-leg"
          position="0 -0.217 0"
          width="0.173" height="0.434"
          material="shader: flat; color: #090910; side: double">
        </a-plane>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const scanHint = document.getElementById('scan-hint');
    const banner = document.getElementById('detected-banner');
    const sceneEl = document.querySelector('a-scene');

    // ======== Инфо-поп-ап для фигур ========
    const INFO = {
      // ===== Плакат 1 =====
      'p1-lines': {
        title: 'Витебск',
        body: 'Витебск — один из старейших городов Республики Беларусь, расположенный на реке Западная Двина. Город обладает богатым культурно-историческим наследием и занимает важное место в истории искусства начала XX века.'
      },
      'p1-black-square': {
        title: 'К. С. Малевич',
        body: 'К. С. Малевич — основатель супрематизма и идейный лидер УНОВИСа. Его работа «Чёрный квадрат» стала символом нового искусства, в котором простая геометрическая форма заменяет предметное изображение и открывает путь к свободному визуальному мышлению.'
      },
      'p1-red-squares': {
        title: 'Красные элементы',
        body: 'Красные элементы являются символом движения и перехода от реального пространства к маршруту нового искусства. Также это отсылает к лестнице на набережной города.'
      },
      // ===== Плакат 2 =====
      'p2-black-square': {
        title: 'УНОВИС',
        body: 'УНОВИС — «Утвердители нового искусства». Объединение возникло в Витебске в 1920 году и было связано с идеями К. С. Малевича, супрематизма и поиском нового художественного языка, основанного на форме, цвете, пространстве и отказе от традиционного изображения.'
      },
      'p2-lines': {
        title: 'Супрематизм',
        body: 'Супрематизм — это искусство чистых форм и цвета. Он отказывается от изображения традиционной живописи и передаёт идею через геометрические формы, движение и пространство.'
      },
      'p2-red-shape': {
        title: 'Стена Малевича',
        body: 'Роспись на здании «Стена Малевича» создана по эскизу К. С. Малевича «Принцип росписи стены, плоскости или всей комнаты, или целой квартиры по системе супрематизма», также известному как «Смерть обоям». Эскиз был создан в Витебске и отражает идею переноса супрематизма в реальное пространство.'
      },
      // ===== Плакат 3 =====
      'p3-head': {
        title: 'Марк Шагал',
        body: 'Марк Шагал — один из главных художественных символов Витебска. Его творчество связано с образом города, памятью, движением и личным восприятием пространства.'
      },
      'p3-leg': {
        title: 'ВНХУ',
        body: 'Марк Шагал основал Витебское Народное Художественное Училище (ВНХУ), ставшее важной точкой развития авангарда. Именно в этой художественной среде позднее возникло объединение УНОВИС.'
      }
    };

    const popup = document.getElementById('info-popup');
    const popupTitle = popup.querySelector('.popup-title');
    const popupBody = popup.querySelector('.popup-body');
    const popupClose = popup.querySelector('.popup-close');

    function openPopup(key) {
      const entry = INFO[key];
      if (!entry) return;
      popupTitle.textContent = entry.title;
      popupBody.textContent = entry.body;
      popup.classList.add('active');
      popup.setAttribute('aria-hidden', 'false');
    }
    function closePopup() {
      popup.classList.remove('active');
      popup.setAttribute('aria-hidden', 'true');
    }

    popupClose.addEventListener('click', closePopup);
    popup.addEventListener('click', (e) => {
      if (e.target === popup) closePopup();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });

    // ======== Надёжный обработчик тапов через THREE.Raycaster ========
    // A-Frame cursor не всегда срабатывает с MindAR, поэтому кастуем луч вручную.
    function setupTapHandler() {
      const THREE_LIB = AFRAME.THREE;
      const raycaster = new THREE_LIB.Raycaster();
      const pointer = new THREE_LIB.Vector2();

      function performRaycast(clientX, clientY) {
        const canvas = sceneEl.canvas;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        const threeCamera = sceneEl.camera;
        if (!threeCamera) return;
        raycaster.setFromCamera(pointer, threeCamera);

        // Собираем все mesh'и из .clickable энтити (для плоскостей, кругов, текста и т.п.)
        const clickableEls = Array.from(document.querySelectorAll('.clickable'));
        const meshes = [];
        const meshToEl = new Map();
        clickableEls.forEach(el => {
          if (!el.object3D) return;
          el.object3D.traverse(node => {
            if (node.isMesh) {
              meshes.push(node);
              meshToEl.set(node, el);
            }
          });
        });

        if (meshes.length === 0) return;

        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length === 0) {
          console.log('[AR] tap miss');
          return;
        }
        const el = meshToEl.get(hits[0].object);
        if (!el) return;
        const key = el.dataset.info;
        console.log('[AR] hit:', key);
        if (key) openPopup(key);
      }

      const canvas = sceneEl.canvas;
      if (!canvas) {
        console.warn('[AR] canvas not ready yet');
        return;
      }
      // pointerup работает и для мыши, и для касаний; в отличие от click, не имеет 300ms задержки на iOS
      canvas.addEventListener('pointerup', (e) => {
        // Игнорируем тапы с зажатой правой кнопкой и т.п.
        if (e.button && e.button !== 0) return;
        performRaycast(e.clientX, e.clientY);
      });
      // Фолбэк для старых браузеров без PointerEvent
      canvas.addEventListener('touchend', (e) => {
        if (window.PointerEvent) return; // иначе задвоит
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        performRaycast(t.clientX, t.clientY);
      });

      console.log('[AR] tap handler ready, clickable elements:', document.querySelectorAll('.clickable').length);
    }

    if (sceneEl.hasLoaded && sceneEl.canvas) {
      setupTapHandler();
    } else {
      sceneEl.addEventListener('loaded', setupTapHandler);
    }

    // ===== Loading splash — управление видимостью =====
    const arLoading = document.getElementById('ar-loading');
    const loadingMsgEl = document.getElementById('loading-msg');

    // Сообщения цикла загрузки — первое уже в HTML, остальные крутятся по очереди.
    const LOADING_MESSAGES = [
      'Подгружаем авангард',
      'Секунду, искусство грузится',
      'Город готовится проявить новый слой',
      'Витебск загружается в новом режиме',
      'Идёт загрузка нового искусства'
    ];
    let loadingMsgIdx = 0;
    let loadingMsgTimer = null;
    function startLoadingMessages() {
      if (loadingMsgTimer || !loadingMsgEl) return;
      loadingMsgTimer = setInterval(() => {
        // плавно прячем текущий
        loadingMsgEl.classList.add('fading');
        setTimeout(() => {
          loadingMsgIdx = (loadingMsgIdx + 1) % LOADING_MESSAGES.length;
          loadingMsgEl.textContent = LOADING_MESSAGES[loadingMsgIdx];
          loadingMsgEl.classList.remove('fading');
        }, 450);                  // должно совпадать с transition opacity в CSS
      }, 2200);
    }
    function stopLoadingMessages() {
      if (loadingMsgTimer) {
        clearInterval(loadingMsgTimer);
        loadingMsgTimer = null;
      }
    }
    // Стартуем ротацию сразу — пока грузятся скрипты A-Frame/MindAR
    startLoadingMessages();

    function hideLoading() {
      if (arLoading && !arLoading.classList.contains('hidden')) {
        stopLoadingMessages();
        arLoading.classList.add('hidden');
        // Полностью убрать через 400ms (после анимации opacity)
        setTimeout(() => { arLoading.style.display = 'none'; }, 400);
      }
    }
    // Страховка: если что-то пошло не так — спрятать спиннер по таймауту
    const loadingSafetyTimeout = setTimeout(hideLoading, 12000);

    // Глобальные обработчики MindAR
    sceneEl.addEventListener('arReady', () => {
      console.log('MindAR готов');
      clearTimeout(loadingSafetyTimeout);
      // arReady — это инит трекера. Видеопоток камеры может ещё не показаться.
      // Ждём первый кадр в <video>, чтобы splash скрылся, когда экран реально готов.
      const video = document.querySelector('video');
      if (video) {
        const onFirst = () => {
          hideLoading();
          video.removeEventListener('loadeddata', onFirst);
          video.removeEventListener('playing', onFirst);
        };
        video.addEventListener('loadeddata', onFirst);
        video.addEventListener('playing', onFirst);
        // Страховка: если события не сработают за 1.5с — всё равно скрыть.
        setTimeout(hideLoading, 1500);
      } else {
        hideLoading();
      }
    });
    sceneEl.addEventListener('arError', (e) => {
      console.error('MindAR error', e);
      hideLoading();
      alert('Не удалось запустить AR.\n\nПроверь:\n1. Сайт открыт по https:// или localhost\n2. Браузер получил доступ к камере\n3. Файл targets.mind лежит рядом с ar.html');
    });

    // Таргет-события — все 3 плаката шарят один баннер/хинт
    const targets = [
      { el: document.querySelector('#target-1'), label: 'ПЛАКАТ I' },
      { el: document.querySelector('#target-2'), label: 'ПЛАКАТ II' },
      { el: document.querySelector('#target-3'), label: 'ПЛАКАТ III' }
    ];
    let activeTargets = 0;
    targets.forEach(({ el, label }) => {
      if (!el) return;
      el.addEventListener('targetFound', () => {
        activeTargets++;
        scanHint.style.display = 'none';
        banner.textContent = '● AR · ' + label;
        banner.style.display = 'block';
      });
      el.addEventListener('targetLost', () => {
        activeTargets = Math.max(0, activeTargets - 1);
        if (activeTargets === 0) {
          banner.style.display = 'none';
          scanHint.style.display = 'block';
        }
      });
    });

    // Старт камеры — общая функция
    function startAR() {
      startScreen.style.display = 'none';
      scanHint.style.display = 'block';
      // На случай если arReady не дойдёт до splash (медленный init) — спрячем по запуску камеры
      // через короткую задержку, чтобы не висел спиннер пока MindAR крутит колёсами.
      setTimeout(hideLoading, 800);

      const begin = () => {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) {
          alert('MindAR не инициализирован. Перезагрузи страницу.');
          return;
        }
        try {
          const result = arSystem.start();
          if (result && typeof result.then === 'function') {
            result.catch(err => {
              console.error(err);
              // Если автозапуск упёрся в требование user-gesture iOS — возвращаем стартовый экран
              if (autostartRequested) {
                startScreen.style.display = 'flex';
                scanHint.style.display = 'none';
              } else {
                alert('Не удалось запустить камеру: ' + (err && err.message ? err.message : err));
              }
            });
          }
        } catch (err) {
          console.error(err);
          if (autostartRequested) {
            startScreen.style.display = 'flex';
            scanHint.style.display = 'none';
          } else {
            alert('Ошибка запуска AR: ' + (err && err.message ? err.message : err));
          }
        }
      };

      if (sceneEl.hasLoaded) {
        begin();
      } else {
        sceneEl.addEventListener('loaded', begin, { once: true });
      }
    }

    // Старт по тапу — нужен для iOS, если не пришли с ?go=1
    startBtn.addEventListener('click', startAR);

    // ===== Авто-старт по URL-параметру ?go=1 =====
    // Если страница пришла из index.html по клику — открываем камеру без второго тапа.
    // Учитываем prerender: Chrome/Edge могут предзагрузить ar.html в фоне (через
    // Speculation Rules на index.html). В prerender-состоянии getUserMedia заблокирован,
    // поэтому ждём `prerenderingchange` (страница активирована переходом с лендинга).
    const autostartRequested = new URLSearchParams(location.search).get('go') === '1';
    if (autostartRequested) {
      startScreen.style.display = 'none';

      const tryAutoStart = () => {
        if (sceneEl.hasLoaded) {
          startAR();
        } else {
          sceneEl.addEventListener('loaded', startAR, { once: true });
        }
      };

      const onActivated = () => {
        // Страница либо никогда не была prerendered, либо только что активировалась
        if (document.readyState === 'complete') {
          tryAutoStart();
        } else {
          window.addEventListener('load', tryAutoStart, { once: true });
        }
      };

      if (document.prerendering) {
        // Не вызываем getUserMedia до активации — браузер всё равно отложит.
        // Спиннер уже показан, скрипты грузятся в фоне → к моменту активации почти всё готово.
        document.addEventListener('prerenderingchange', onActivated, { once: true });
      } else {
        onActivated();
      }
    } else {
      // Зашли напрямую без ?go=1 — нужен ручной тап. Прячем splash, показываем стартовый экран.
      hideLoading();
    }
  </script>
</body>
