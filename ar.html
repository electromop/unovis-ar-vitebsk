<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>УНОВИС × Витебск — AR</title>

  <!-- defer: HTML парсится, спиннер рисуется до загрузки JS; defer гарантирует порядок -->
  <script defer src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    /* HTML — тёмный фон. На <body> background НЕ ставим — там через
       z-index: -2 лежит <video> с камерой, body должен быть прозрачным.
       Тёмный фон html виден только когда камера ещё не отдаёт кадры
       (или эмулятор без камеры), вместо браузерного белого. */
    html {
      background: #090910;
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: 'Courier New', monospace;
      color: #FFFFFF;
    }

    /* Оверлеи поверх AR-сцены */
    #start-screen, #scan-hint, #detected-banner {
      z-index: 9999;
    }

    /* ===== Глушим встроенные оверлеи A-Frame и MindAR =====
       Голубой фон с тремя белыми точками — это loading-screen A-Frame
       (background #24CAFF + dots). Гасим атрибутом + CSS для надёжности.
       MindAR's UI (uiLoading/uiScanning/uiError) — аналогично. */
    .a-loader-title,
    .mindar-ui-overlay,
    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-compatibility,
    .mindar-ui-error {
      display: none !important;
    }
    /* ===== Loading splash — виден сразу при загрузке страницы =====
       Не зависит от A-Frame/MindAR (они грузятся defer). Прячется при arReady. */
    #ar-loading {
      position: fixed;
      inset: 0;
      background: #090910;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      transition: opacity 0.3s ease;
    }
    #ar-loading.hidden { opacity: 0; pointer-events: none; }
    .ar-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #CF1417;
      border-radius: 50%;
      animation: ar-spin 0.85s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes ar-spin { to { transform: rotate(360deg); } }
    #ar-loading p {
      font-size: 13px;
      opacity: 0.75;
      letter-spacing: 3px;
      margin: 0;
    }

    /* Стартовый экран */
    #start-screen {
      position: fixed; inset: 0;
      background: #090910;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 32px;
      text-align: center;
    }
    #start-screen h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 56px;
      margin: 0 0 8px;
      letter-spacing: 4px;
      color: #FFFFFF;
    }
    #start-screen .accent { color: #CF1417; }
    #start-screen .sub {
      font-size: 13px;
      letter-spacing: 6px;
      opacity: 0.7;
      margin-bottom: 40px;
    }
    #start-screen p {
      font-size: 15px;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 0 32px;
      opacity: 0.85;
    }
    #start-btn {
      background: #CF1417;
      color: #FFFFFF;
      border: none;
      padding: 18px 42px;
      font-family: Impact, sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 0;
    }
    #start-btn:active { transform: translate(2px, 2px); }

    /* Полоски-акценты */
    .stripes {
      position: absolute;
      top: 24px; right: 24px;
      display: flex; gap: 6px;
    }
    .stripes div { width: 22px; height: 22px; }
    .s1 { background: #090910; border: 1px solid #FFFFFF; }
    .s2 { background: #CF1417; }
    .s3 { background: #2D2C7F; }

    /* Подсказка сканирования */
    #scan-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17,17,17,0.75);
      color: #FFFFFF;
      padding: 10px 18px;
      font-size: 13px;
      letter-spacing: 3px;
      border-left: 3px solid #CF1417;
      z-index: 500;
      display: none;
    }

    /* Статус при обнаружении */
    #detected-banner {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #CF1417;
      color: #FFFFFF;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 3px;
      z-index: 500;
      display: none;
    }

    /* Информационный поп-ап при клике на фигуру */
    #info-popup {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #info-popup.active {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-card {
      background: #FFFFFF;
      color: #111;
      padding: 34px 28px 28px;
      max-width: 360px;
      width: 100%;
      position: relative;
      border-left: 6px solid #CF1417;
      font-family: 'Courier New', monospace;
      box-shadow: 8px 8px 0 rgba(216, 48, 26, 0.25);
      transform: translateY(12px);
      transition: transform 0.3s ease;
    }
    #info-popup.active .popup-card {
      transform: translateY(0);
    }
    .popup-accent {
      height: 4px;
      width: 42px;
      background: #CF1417;
      margin-bottom: 14px;
    }
    .popup-title {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      margin: 0 0 14px;
      color: #111;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .popup-body {
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: 0.3px;
      color: #1a1a1a;
    }
    .popup-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 32px;
      font-family: Impact, sans-serif;
      cursor: pointer;
      color: #111;
      line-height: 1;
      padding: 4px 10px;
    }
    .popup-close:active {
      transform: translate(1px, 1px);
    }

  </style>
</head>
<body>

  <!-- Loading splash — показывается сразу при заходе на страницу,
       прячется когда MindAR прогревается (arReady) или по таймауту-страховке. -->
  <div id="ar-loading" aria-hidden="false">
    <div class="ar-spinner"></div>
    <p>ЗАПУСК · КАМЕРЫ</p>
  </div>

  <!-- Старт -->
  <div id="start-screen">
    <div class="stripes"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>
    <h1>УНОВИС<span class="accent">.</span></h1>
    <div class="sub">ВИТЕБСК · 1919—1922</div>
    <p>Наведи камеру на плакат<br>и увидишь, как супрематизм оживает<br>спустя 100 лет.</p>
    <button id="start-btn">НАЧАТЬ AR →</button>
    <p style="font-size:11px; opacity:0.5; margin-top:32px; letter-spacing:2px;">
      Требуется доступ к камере<br>Работает в Safari / Chrome на телефоне
    </p>
  </div>

  <div id="scan-hint">НАВЕДИ · КАМЕРУ · НА · ЛЮБОЙ · ПЛАКАТ <span style="opacity:0.6">· ТАПНИ ФИГУРУ</span></div>
  <div id="detected-banner">● AR АКТИВЕН</div>

  <!-- Информационный поп-ап -->
  <div id="info-popup" aria-hidden="true">
    <div class="popup-card">
      <button class="popup-close" aria-label="Закрыть">×</button>
      <div class="popup-accent"></div>
      <h2 class="popup-title"></h2>
      <div class="popup-body"></div>
    </div>
  </div>

  <!-- A-Frame сцена с MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.00001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
    loading-screen="enabled: false"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Локальные ресурсы можно положить сюда -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">
      <!-- Курсор на основе тапа по экрану -->
      <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 20;"></a-entity>
    </a-camera>

    <!-- Свет — принудительно, чтобы материалы светились одинаково с любых углов -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 1 1"></a-entity>

    <!-- Цель 0: наш плакат -->
    <a-entity mindar-image-target="targetIndex: 0" id="target">

      <!-- Парящий красный квадрат — классика Малевича — широкий дрейф + wobble вращения + дыхание -->
      <a-plane
        id="red-square"
        class="clickable"
        data-info="red-square"
        position="0.25 0.15 0.05"
        width="0.28" height="0.28"
        rotation="0 0 10"
        material="shader: flat; color: #CF1417; side: double"
        animation__rot="property: rotation; from: 0 0 -8; to: 0 0 22; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__float="property: position; from: 0.18 0.08 0.05; to: 0.32 0.22 0.05; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
        animation__breathe="property: scale; from: 1 1 1; to: 1.08 1.08 1; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutCubic">
      </a-plane>

      <!-- Чёрный круг — крупный дрейф по диагонали -->
      <a-circle
        id="black-disc"
        class="clickable"
        data-info="black-disc"
        position="-0.3 -0.05 0.03"
        radius="0.13"
        material="shader: flat; color: #090910; side: double"
        animation__float="property: position; from: -0.38 -0.14 0.03; to: -0.22 0.04 0.03; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; delay: 200; easing: easeOutCubic">
      </a-circle>

      <!-- Белое кольцо внутри круга — идёт синхронно с чёрным -->
      <a-circle
        position="-0.3 -0.05 0.04"
        radius="0.06"
        material="shader: flat; color: #FFFFFF; side: double"
        animation__float="property: position; from: -0.38 -0.14 0.04; to: -0.22 0.04 0.04; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__pulse="property: scale; from: 0.85 0.85 1; to: 1.15 1.15 1; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; delay: 350; easing: easeOutCubic">
      </a-circle>

      <!-- Синий треугольник — активное вращение + дрейф -->
      <a-triangle
        id="blue-tri"
        class="clickable"
        data-info="blue-tri"
        position="0.2 -0.3 0.04"
        vertex-a="0 0.18 0"
        vertex-b="-0.16 -0.09 0"
        vertex-c="0.16 -0.09 0"
        rotation="0 0 -20"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__rot="property: rotation; to: 0 0 340; loop: true; dur: 16000; easing: linear"
        animation__float="property: position; from: 0.12 -0.38 0.04; to: 0.28 -0.22 0.04; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 500; easing: easeOutCubic">
      </a-triangle>

      <!-- Жёлтый брусок — дрейф + покачивание угла -->
      <a-plane
        class="clickable"
        data-info="yellow-bar"
        position="0 0.35 0.02"
        width="0.5" height="0.04"
        rotation="0 0 6"
        material="shader: flat; color: #EDC205; side: double"
        animation__rot="property: rotation; from: 0 0 -2; to: 0 0 12; dir: alternate; loop: true; dur: 6200; easing: easeInOutSine"
        animation__float="property: position; from: -0.06 0.31 0.02; to: 0.06 0.39 0.02; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 700; easing: easeOutCubic">
      </a-plane>

      <!-- Красная диагональная полоса — горизонтальный дрейф -->
      <a-plane
        class="clickable"
        data-info="red-diagonal"
        position="0 -0.45 0.01"
        width="0.95" height="0.018"
        rotation="0 0 -6"
        material="shader: flat; color: #CF1417; side: double"
        animation__rot="property: rotation; from: 0 0 -10; to: 0 0 -2; dir: alternate; loop: true; dur: 7400; easing: easeInOutSine"
        animation__float="property: position; from: -0.07 -0.47 0.01; to: 0.07 -0.43 0.01; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1200; delay: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Чёрный вертикальный брусок — дрейф + наклон -->
      <a-plane
        class="clickable"
        data-info="black-vertical"
        position="0.42 -0.3 0.02"
        width="0.015" height="0.3"
        rotation="0 0 0"
        material="shader: flat; color: #090910; side: double"
        animation__rot="property: rotation; from: 0 0 -6; to: 0 0 6; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__float="property: position; from: 0.38 -0.36 0.02; to: 0.46 -0.24 0.02; dir: alternate; loop: true; dur: 5200; easing: easeInOutSine"
        animation__in="property: scale; from: 1 0 1; to: 1 1 1; dur: 900; delay: 1100; easing: easeOutCubic">
      </a-plane>

      <!-- Маленький красный круг — пульсация + широкая орбита -->
      <a-circle
        class="clickable"
        data-info="small-red"
        position="-0.38 -0.4 0.03"
        radius="0.035"
        material="shader: flat; color: #CF1417; side: double"
        animation__pulse="property: scale; dir: alternate; from: 0.85 0.85 1; to: 1.55 1.55 1; loop: true; dur: 1800; easing: easeInOutSine"
        animation__float="property: position; from: -0.44 -0.46 0.03; to: -0.32 -0.34 0.03; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 1300; easing: easeOutCubic">
      </a-circle>

      <!-- Текст "УНОВИС" парящий над плакатом — более заметный свинг -->
      <a-text
        class="clickable"
        data-info="unovis-text"
        value="УНОВИС"
        position="0 0.5 0.08"
        align="center"
        color="#CF1417"
        width="1.6"
        font="kelsonsans"
        animation__float="property: position; from: -0.06 0.47 0.08; to: 0.06 0.53 0.08; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 1500; easing: easeOutCubic">
      </a-text>

      <a-text
        value="VITEBSK 1919-1922"
        position="0 0.38 0.08"
        align="center"
        color="#FFFFFF"
        width="1.2"
        font="kelsonsans"
        animation__float="property: position; from: -0.03 0.37 0.08; to: 0.03 0.39 0.08; dir: alternate; loop: true; dur: 6400; easing: easeInOutSine"
        animation__in="property: opacity; from: 0; to: 1; dur: 1200; delay: 1900; easing: easeInOutSine">
      </a-text>

      <!-- Маленькие парящие квадратики-"спутники" — сильнее вращаются и дрейфуют -->
      <a-plane position="0.45 0.4 0.04" width="0.04" height="0.04"
        material="shader: flat; color: #090910; side: double"
        animation__rot="property: rotation; to: 0 0 360; loop: true; dur: 9000; easing: linear"
        animation__float="property: position; from: 0.38 0.34 0.04; to: 0.5 0.46 0.04; dir: alternate; loop: true; dur: 4600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; delay: 1700; easing: easeOutCubic">
      </a-plane>

      <a-plane position="-0.45 0.3 0.04" width="0.03" height="0.03"
        material="shader: flat; color: #CF1417; side: double"
        animation__rot="property: rotation; to: 0 0 -360; loop: true; dur: 11000; easing: linear"
        animation__float="property: position; from: -0.5 0.24 0.04; to: -0.4 0.36 0.04; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; delay: 1800; easing: easeOutCubic">
      </a-plane>

      <!-- Крест-архитектон (плоский плюс) — вращается быстрее, дрейфует шире -->
      <a-entity position="-0.15 0.25 0.06"
        animation__rot="property: rotation; to: 0 0 360; loop: true; dur: 12000; easing: linear"
        animation__float="property: position; from: -0.22 0.19 0.06; to: -0.08 0.31 0.06; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 2000; easing: easeOutCubic">
        <a-plane class="clickable" data-info="architekton" width="0.12" height="0.02" material="shader: flat; color: #090910; side: double"></a-plane>
        <a-plane class="clickable" data-info="architekton" width="0.02" height="0.12" material="shader: flat; color: #CF1417; side: double"></a-plane>
      </a-entity>

    </a-entity>

    <!-- ============================================================ -->
    <!-- Цель 1: плакат "Ритм города" — пульсирующая, ритмичная сцена -->
    <!-- Координаты: width=1 → X от -0.5 до 0.5; aspect 1697:2400 →    -->
    <!-- height=1.414 → Y от -0.707 до +0.707                         -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-rhythm">

      <!-- Крупный терракотовый блок (дом/квартал) — медленное дыхание + лёгкий дрейф -->
      <a-plane
        class="clickable"
        data-info="rg-big-block"
        position="-0.13 0.38 0.04"
        width="0.36" height="0.22"
        rotation="0 0 2"
        material="shader: flat; color: #c03c19; side: double"
        animation__breathe="property: scale; from: 0.96 0.96 1; to: 1.05 1.05 1; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine"
        animation__drift="property: position; from: -0.15 0.36 0.04; to: -0.11 0.40 0.04; dir: alternate; loop: true; dur: 6400; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 -1; to: 0 0 5; dir: alternate; loop: true; dur: 7200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Верхняя длинная чёрная линия — "улица", пульсирует шириной (ток движения) -->
      <a-plane
        class="clickable"
        data-info="rg-tram-top"
        position="0.05 0.18 0.02"
        width="0.55" height="0.014"
        rotation="0 0 -4"
        material="shader: flat; color: #191919; side: double"
        animation__pulse="property: scale; from: 0.85 1 1; to: 1.15 1 1; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"
        animation__drift="property: position; from: 0.00 0.18 0.02; to: 0.10 0.18 0.02; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 900; delay: 200; easing: easeOutCubic">
      </a-plane>

      <!-- Маленький терракотовый квадрат 1 — первый такт метронома -->
      <a-plane
        class="clickable"
        data-info="rg-beat-1"
        position="-0.04 0.02 0.03"
        width="0.08" height="0.08"
        rotation="0 0 6"
        material="shader: flat; color: #c03c19; side: double"
        animation__beat="property: scale; from: 0.9 0.9 1; to: 1.25 1.25 1; dir: alternate; loop: true; dur: 800; easing: easeInOutSine"
        animation__drift="property: position; from: -0.07 0.02 0.03; to: -0.01 0.02 0.03; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; delay: 400; easing: easeOutCubic">
      </a-plane>

      <!-- Двойная чёрная линия (средняя) — поток транспорта, дрейфует по оси X -->
      <a-entity position="-0.14 -0.12 0.02"
        animation__flow="property: position; from: -0.20 -0.12 0.02; to: -0.08 -0.12 0.02; dir: alternate; loop: true; dur: 4200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 900; delay: 600; easing: easeOutCubic">
        <a-plane class="clickable" data-info="rg-tram-mid" position="0 0.012 0" width="0.48" height="0.012" rotation="0 0 -4"
          material="shader: flat; color: #191919; side: double"></a-plane>
        <a-plane class="clickable" data-info="rg-tram-mid" position="0 -0.012 0" width="0.48" height="0.012" rotation="0 0 -4"
          material="shader: flat; color: #191919; side: double"></a-plane>
      </a-entity>

      <!-- Маленький терракотовый квадрат 2 — второй такт (смещение по фазе) -->
      <a-plane
        class="clickable"
        data-info="rg-beat-2"
        position="0.10 -0.16 0.03"
        width="0.08" height="0.08"
        rotation="0 0 6"
        material="shader: flat; color: #c03c19; side: double"
        animation__beat="property: scale; from: 0.9 0.9 1; to: 1.25 1.25 1; dir: alternate; loop: true; dur: 800; delay: 400; easing: easeInOutSine"
        animation__drift="property: position; from: 0.07 -0.16 0.03; to: 0.13 -0.16 0.03; dir: alternate; loop: true; dur: 3400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; delay: 800; easing: easeOutCubic">
      </a-plane>

      <!-- Двойная чёрная линия (нижняя) — аналогичный поток, противофаза -->
      <a-entity position="-0.18 -0.30 0.02"
        animation__flow="property: position; from: -0.12 -0.30 0.02; to: -0.24 -0.30 0.02; dir: alternate; loop: true; dur: 4200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 900; delay: 1000; easing: easeOutCubic">
        <a-plane class="clickable" data-info="rg-tram-low" position="0 0.012 0" width="0.48" height="0.012" rotation="0 0 -4"
          material="shader: flat; color: #191919; side: double"></a-plane>
        <a-plane class="clickable" data-info="rg-tram-low" position="0 -0.012 0" width="0.48" height="0.012" rotation="0 0 -4"
          material="shader: flat; color: #191919; side: double"></a-plane>
      </a-entity>

      <!-- Маленький терракотовый квадрат 3 — третий такт -->
      <a-plane
        class="clickable"
        data-info="rg-beat-3"
        position="0.22 -0.42 0.03"
        width="0.08" height="0.08"
        rotation="0 0 6"
        material="shader: flat; color: #c03c19; side: double"
        animation__beat="property: scale; from: 0.9 0.9 1; to: 1.25 1.25 1; dir: alternate; loop: true; dur: 800; delay: 200; easing: easeInOutSine"
        animation__drift="property: position; from: 0.19 -0.42 0.03; to: 0.25 -0.42 0.03; dir: alternate; loop: true; dur: 3600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; delay: 1200; easing: easeOutCubic">
      </a-plane>

      <!-- Текст "РИТМ ГОРОДА" — появляется тиканьем -->
      <a-text
        class="clickable"
        data-info="rg-title"
        value="РИТМ ГОРОДА"
        position="0.2 0.58 0.06"
        align="center"
        color="#090910"
        width="1.3"
        font="kelsonsans"
        animation__pulse="property: scale; from: 0.97 0.97 1; to: 1.04 1.04 1; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"
        animation__in="property: opacity; from: 0; to: 1; dur: 1000; delay: 1400; easing: easeInOutSine">
      </a-text>

      <!-- Текст "ВІЦЕБСК" — солидный низ -->
      <a-text
        class="clickable"
        data-info="rg-vitebsk"
        value="ВIЦЕБСК"
        position="0 -0.56 0.06"
        align="center"
        color="#c03c19"
        width="1.4"
        font="kelsonsans"
        animation__float="property: position; from: -0.02 -0.57 0.06; to: 0.02 -0.55 0.06; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: opacity; from: 0; to: 1; dur: 1200; delay: 1700; easing: easeInOutSine">
      </a-text>

      <!-- Парящие искры-квадратики вокруг композиции — ощущение живого города -->
      <a-plane position="-0.38 0.15 0.05" width="0.018" height="0.018"
        material="shader: flat; color: #c03c19; side: double"
        animation__rot="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear"
        animation__float="property: position; from: -0.42 0.10 0.05; to: -0.34 0.20 0.05; dir: alternate; loop: true; dur: 4400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; delay: 1800; easing: easeOutCubic">
      </a-plane>

      <a-plane position="0.38 0.05 0.05" width="0.014" height="0.014"
        material="shader: flat; color: #191919; side: double"
        animation__rot="property: rotation; to: 0 0 -360; loop: true; dur: 9000; easing: linear"
        animation__float="property: position; from: 0.34 0.00 0.05; to: 0.42 0.10 0.05; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 700; delay: 2000; easing: easeOutCubic">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const scanHint = document.getElementById('scan-hint');
    const banner = document.getElementById('detected-banner');
    const sceneEl = document.querySelector('a-scene');

    // ======== Инфо-поп-ап для фигур ========
    const INFO = {
      'red-square': {
        title: 'Красный квадрат',
        body: 'Малевич, 1915. Красный квадрат — «крестьянка в двух измерениях», живое в противовес чёрному. Цвет как чистая энергия, освобождённая от вещи.'
      },
      'black-disc': {
        title: 'Круг',
        body: 'Одна из трёх супрематических праформ вместе с квадратом и крестом. Круг — движение, планета, полное отрицание земного притяжения.'
      },
      'blue-tri': {
        title: 'Треугольник',
        body: '«Клином красным бей белых!» — плакат Лисицкого, 1919. Треугольник стал у УНОВИСа знаком удара, вектора, революционного движения.'
      },
      'yellow-bar': {
        title: 'Жёлтая горизонталь',
        body: 'Горизонталь — основание нового мира. Жёлтый у супрематистов — цвет света и энергии, маркер границы между старым и новым порядком.'
      },
      'red-diagonal': {
        title: 'Диагональ',
        body: 'Диагональ взрывает статику прямоугольного мира. Для Лисицкого это траектория полёта, ось космической динамики. «ПРОУН» — проект утверждения нового.'
      },
      'black-vertical': {
        title: 'Вертикаль',
        body: 'Минимум средств — максимум смысла. Вертикаль как ось мира, опора супрематической архитектуры. Чашник и Суетин строили из таких элементов фарфор и ткани.'
      },
      'small-red': {
        title: 'Точка',
        body: 'Элементарная частица супрематизма. По Малевичу: из точки рождается линия, из линии — плоскость, из плоскости — новая вселенная.'
      },
      'unovis-text': {
        title: 'УНОВИС',
        body: 'Утвердители Нового Искусства. Витебск, 1919–1922. Малевич, Лисицкий, Чашник, Суетин, Хидекель, Юдин. Коллектив, впервые объявивший искусство инструментом построения мира.'
      },
      'architekton': {
        title: 'Архитектон',
        body: 'Объёмная супрематическая композиция. Малевич проектировал архитектоны как модели городов будущего — летающих, вне гравитации, из чистых геометрических форм.'
      },
      // ---- Плакат "Ритм города" ----
      'rg-big-block': {
        title: 'Квартал',
        body: 'Крупный терракотовый блок — образ здания, дома, квартала. В супрематизме прямоугольник перестаёт быть стеной и становится чистой массой, ритмической единицей города.'
      },
      'rg-tram-top': {
        title: 'Трамвайная линия',
        body: 'В Витебске трамвай появился в 1898 — один из первых в Российской империи. Для УНОВИСа трамвай — знак индустриальной скорости, прямая, проведённая через плоть города.'
      },
      'rg-tram-mid': {
        title: 'Поток',
        body: 'Парные чёрные линии — это движение: трамвайные пути, улицы, потоки людей. У Лисицкого горизонталь всегда несёт направление, а не просто делит плоскость.'
      },
      'rg-tram-low': {
        title: 'Ритм путей',
        body: 'Повторяющиеся линии создают визуальный темп. Город читается как партитура: каждая улица — такт, каждое пересечение — акцент.'
      },
      'rg-beat-1': {
        title: 'Такт I',
        body: 'Малые красные квадраты — пульсация. У супрематистов квадрат — первичный знак, ноль формы. Здесь он становится битом, на который насажен весь ритм композиции.'
      },
      'rg-beat-2': {
        title: 'Такт II',
        body: 'Сдвиг по фазе: второй квадрат бьёт со смещением. Так работает синкопа — и так живёт город: светофоры, шаги, колёса, голоса — в одном сбитом ритме.'
      },
      'rg-beat-3': {
        title: 'Такт III',
        body: 'Третий удар замыкает мотив. УНОВИС мыслил композицию музыкально: композиции Малевича и Суетина прямо называли «супрематическими партитурами».'
      },
      'rg-title': {
        title: 'Ритм города',
        body: 'Понятие, которое УНОВИС превратил из метафоры в метод. Город — не фон, а материал: его линии, темпы и разрывы становятся языком нового искусства. «Мир как ритм» — формула эпохи.'
      },
      'rg-vitebsk': {
        title: 'Віцебск',
        body: 'Витебск 1919–1922 — парадоксальная столица авангарда. Провинциальный город с населением 90 тысяч стал центром русского модернизма: здесь жили Шагал, Малевич, Лисицкий, Добужинский, Пэн, Цадкин.'
      }
    };

    const popup = document.getElementById('info-popup');
    const popupTitle = popup.querySelector('.popup-title');
    const popupBody = popup.querySelector('.popup-body');
    const popupClose = popup.querySelector('.popup-close');

    function openPopup(key) {
      const entry = INFO[key];
      if (!entry) return;
      popupTitle.textContent = entry.title;
      popupBody.textContent = entry.body;
      popup.classList.add('active');
      popup.setAttribute('aria-hidden', 'false');
    }
    function closePopup() {
      popup.classList.remove('active');
      popup.setAttribute('aria-hidden', 'true');
    }

    popupClose.addEventListener('click', closePopup);
    popup.addEventListener('click', (e) => {
      if (e.target === popup) closePopup();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });

    // ======== Надёжный обработчик тапов через THREE.Raycaster ========
    // A-Frame cursor не всегда срабатывает с MindAR, поэтому кастуем луч вручную.
    function setupTapHandler() {
      const THREE_LIB = AFRAME.THREE;
      const raycaster = new THREE_LIB.Raycaster();
      const pointer = new THREE_LIB.Vector2();

      function performRaycast(clientX, clientY) {
        const canvas = sceneEl.canvas;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        const threeCamera = sceneEl.camera;
        if (!threeCamera) return;
        raycaster.setFromCamera(pointer, threeCamera);

        // Собираем все mesh'и из .clickable энтити (для плоскостей, кругов, текста и т.п.)
        const clickableEls = Array.from(document.querySelectorAll('.clickable'));
        const meshes = [];
        const meshToEl = new Map();
        clickableEls.forEach(el => {
          if (!el.object3D) return;
          el.object3D.traverse(node => {
            if (node.isMesh) {
              meshes.push(node);
              meshToEl.set(node, el);
            }
          });
        });

        if (meshes.length === 0) return;

        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length === 0) {
          console.log('[AR] tap miss');
          return;
        }
        const el = meshToEl.get(hits[0].object);
        if (!el) return;
        const key = el.dataset.info;
        console.log('[AR] hit:', key);
        if (key) openPopup(key);
      }

      const canvas = sceneEl.canvas;
      if (!canvas) {
        console.warn('[AR] canvas not ready yet');
        return;
      }
      // pointerup работает и для мыши, и для касаний; в отличие от click, не имеет 300ms задержки на iOS
      canvas.addEventListener('pointerup', (e) => {
        // Игнорируем тапы с зажатой правой кнопкой и т.п.
        if (e.button && e.button !== 0) return;
        performRaycast(e.clientX, e.clientY);
      });
      // Фолбэк для старых браузеров без PointerEvent
      canvas.addEventListener('touchend', (e) => {
        if (window.PointerEvent) return; // иначе задвоит
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        performRaycast(t.clientX, t.clientY);
      });

      console.log('[AR] tap handler ready, clickable elements:', document.querySelectorAll('.clickable').length);
    }

    if (sceneEl.hasLoaded && sceneEl.canvas) {
      setupTapHandler();
    } else {
      sceneEl.addEventListener('loaded', setupTapHandler);
    }

    // ===== Loading splash — управление видимостью =====
    const arLoading = document.getElementById('ar-loading');
    function hideLoading() {
      if (arLoading && !arLoading.classList.contains('hidden')) {
        arLoading.classList.add('hidden');
        // Полностью убрать через 400ms (после анимации opacity)
        setTimeout(() => { arLoading.style.display = 'none'; }, 400);
      }
    }
    // Страховка: если что-то пошло не так — спрятать спиннер по таймауту
    const loadingSafetyTimeout = setTimeout(hideLoading, 12000);

    // Глобальные обработчики MindAR
    sceneEl.addEventListener('arReady', () => {
      console.log('MindAR готов');
      clearTimeout(loadingSafetyTimeout);
      // arReady — это инит трекера. Видеопоток камеры может ещё не показаться.
      // Ждём первый кадр в <video>, чтобы splash скрылся, когда экран реально готов.
      const video = document.querySelector('video');
      if (video) {
        const onFirst = () => {
          hideLoading();
          video.removeEventListener('loadeddata', onFirst);
          video.removeEventListener('playing', onFirst);
        };
        video.addEventListener('loadeddata', onFirst);
        video.addEventListener('playing', onFirst);
        // Страховка: если события не сработают за 1.5с — всё равно скрыть.
        setTimeout(hideLoading, 1500);
      } else {
        hideLoading();
      }
    });
    sceneEl.addEventListener('arError', (e) => {
      console.error('MindAR error', e);
      hideLoading();
      alert('Не удалось запустить AR.\n\nПроверь:\n1. Сайт открыт по https:// или localhost\n2. Браузер получил доступ к камере\n3. Файл targets.mind лежит рядом с ar.html');
    });

    // Таргет-события — оба плаката шарят один баннер/хинт
    const targets = [
      { el: document.querySelector('#target'), label: 'УНОВИС' },
      { el: document.querySelector('#target-rhythm'), label: 'РИТМ ГОРОДА' }
    ];
    let activeTargets = 0;
    targets.forEach(({ el, label }) => {
      if (!el) return;
      el.addEventListener('targetFound', () => {
        activeTargets++;
        scanHint.style.display = 'none';
        banner.textContent = '● AR · ' + label;
        banner.style.display = 'block';
      });
      el.addEventListener('targetLost', () => {
        activeTargets = Math.max(0, activeTargets - 1);
        if (activeTargets === 0) {
          banner.style.display = 'none';
          scanHint.style.display = 'block';
        }
      });
    });

    // Старт камеры — общая функция
    function startAR() {
      startScreen.style.display = 'none';
      scanHint.style.display = 'block';
      // На случай если arReady не дойдёт до splash (медленный init) — спрячем по запуску камеры
      // через короткую задержку, чтобы не висел спиннер пока MindAR крутит колёсами.
      setTimeout(hideLoading, 800);

      const begin = () => {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) {
          alert('MindAR не инициализирован. Перезагрузи страницу.');
          return;
        }
        try {
          const result = arSystem.start();
          if (result && typeof result.then === 'function') {
            result.catch(err => {
              console.error(err);
              // Если автозапуск упёрся в требование user-gesture iOS — возвращаем стартовый экран
              if (autostartRequested) {
                startScreen.style.display = 'flex';
                scanHint.style.display = 'none';
              } else {
                alert('Не удалось запустить камеру: ' + (err && err.message ? err.message : err));
              }
            });
          }
        } catch (err) {
          console.error(err);
          if (autostartRequested) {
            startScreen.style.display = 'flex';
            scanHint.style.display = 'none';
          } else {
            alert('Ошибка запуска AR: ' + (err && err.message ? err.message : err));
          }
        }
      };

      if (sceneEl.hasLoaded) {
        begin();
      } else {
        sceneEl.addEventListener('loaded', begin, { once: true });
      }
    }

    // Старт по тапу — нужен для iOS, если не пришли с ?go=1
    startBtn.addEventListener('click', startAR);

    // ===== Авто-старт по URL-параметру ?go=1 =====
    // Если страница пришла из index.html по клику — открываем камеру без второго тапа.
    // Учитываем prerender: Chrome/Edge могут предзагрузить ar.html в фоне (через
    // Speculation Rules на index.html). В prerender-состоянии getUserMedia заблокирован,
    // поэтому ждём `prerenderingchange` (страница активирована переходом с лендинга).
    const autostartRequested = new URLSearchParams(location.search).get('go') === '1';
    if (autostartRequested) {
      startScreen.style.display = 'none';

      const tryAutoStart = () => {
        if (sceneEl.hasLoaded) {
          startAR();
        } else {
          sceneEl.addEventListener('loaded', startAR, { once: true });
        }
      };

      const onActivated = () => {
        // Страница либо никогда не была prerendered, либо только что активировалась
        if (document.readyState === 'complete') {
          tryAutoStart();
        } else {
          window.addEventListener('load', tryAutoStart, { once: true });
        }
      };

      if (document.prerendering) {
        // Не вызываем getUserMedia до активации — браузер всё равно отложит.
        // Спиннер уже показан, скрипты грузятся в фоне → к моменту активации почти всё готово.
        document.addEventListener('prerenderingchange', onActivated, { once: true });
      } else {
        onActivated();
      }
    } else {
      // Зашли напрямую без ?go=1 — нужен ручной тап. Прячем splash, показываем стартовый экран.
      hideLoading();
    }
  </script>
