<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>УНОВИС × Витебск — AR</title>

  <!-- Onest для UI-надписей. Шрифт уже в кеше после визита на лендинг → +0ms. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap">

  <!-- Синхронная загрузка — критично для iOS Safari: с defer ломается user-gesture
       window для getUserMedia после клика на лендинге, камера не запрашивается. -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    /* HTML — тёмный фон. На <body> background НЕ ставим — там через
       z-index: -2 лежит <video> с камерой, body должен быть прозрачным.
       Тёмный фон html виден только когда камера ещё не отдаёт кадры
       (или эмулятор без камеры), вместо браузерного белого. */
    html {
      background: #090910;
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: 'Courier New', monospace;
      color: #FFFFFF;
    }

    /* Оверлеи поверх AR-сцены */
    #start-screen, #scan-hint, #detected-banner {
      z-index: 9999;
    }

    /* ===== Глушим встроенные оверлеи A-Frame и MindAR =====
       Голубой фон с тремя белыми точками — это loading-screen A-Frame
       (background #24CAFF + dots). Гасим атрибутом + CSS для надёжности.
       MindAR's UI (uiLoading/uiScanning/uiError) — аналогично. */
    .a-loader-title,
    .mindar-ui-overlay,
    .mindar-ui-loading,
    .mindar-ui-scanning,
    .mindar-ui-compatibility,
    .mindar-ui-error {
      display: none !important;
    }
    /* ===== Loading splash — виден сразу при загрузке страницы =====
       Не зависит от A-Frame/MindAR (они грузятся defer). Прячется при arReady. */
    #ar-loading {
      position: fixed;
      inset: 0;
      background: #090910;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      transition: opacity 0.3s ease;
    }
    #ar-loading.hidden { opacity: 0; pointer-events: none; }
    .ar-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #CF1417;
      border-radius: 50%;
      animation: ar-spin 0.85s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes ar-spin { to { transform: rotate(360deg); } }
    #ar-loading p {
      font-size: 13px;
      opacity: 0.75;
      letter-spacing: 3px;
      margin: 0;
    }

    /* Стартовый экран */
    #start-screen {
      position: fixed; inset: 0;
      background: #090910;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 32px;
      text-align: center;
    }
    #start-screen h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 56px;
      margin: 0 0 8px;
      letter-spacing: 4px;
      color: #FFFFFF;
    }
    #start-screen .accent { color: #CF1417; }
    #start-screen .sub {
      font-size: 13px;
      letter-spacing: 6px;
      opacity: 0.7;
      margin-bottom: 40px;
    }
    #start-screen p {
      font-size: 15px;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 0 32px;
      opacity: 0.85;
    }
    #start-btn {
      background: #CF1417;
      color: #FFFFFF;
      border: none;
      padding: 18px 42px;
      font-family: Impact, sans-serif;
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
      border-radius: 0;
    }
    #start-btn:active { transform: translate(2px, 2px); }

    /* Полоски-акценты */
    .stripes {
      position: absolute;
      top: 24px; right: 24px;
      display: flex; gap: 6px;
    }
    .stripes div { width: 22px; height: 22px; }
    .s1 { background: #090910; border: 1px solid #FFFFFF; }
    .s2 { background: #CF1417; }
    .s3 { background: #2D2C7F; }

    /* Подсказка сканирования */
    #scan-hint {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(9, 9, 16, 0.78);
      color: #FFFFFF;
      padding: 10px 16px;
      font-family: 'Onest', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.3px;
      line-height: 1.4;
      text-align: center;
      border-left: 3px solid #CF1417;
      z-index: 500;
      display: none;
      max-width: calc(100% - 48px);
      white-space: nowrap;
    }
    #scan-hint .hint-sub {
      display: block;
      margin-top: 3px;
      font-weight: 400;
      font-size: 10px;
      opacity: 0.65;
    }

    /* Статус при обнаружении */
    #detected-banner {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #CF1417;
      color: #FFFFFF;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 3px;
      z-index: 500;
      display: none;
    }

    /* Информационный поп-ап при клике на фигуру */
    #info-popup {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #info-popup.active {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-card {
      background: #FFFFFF;
      color: #111;
      padding: 34px 28px 28px;
      max-width: 360px;
      width: 100%;
      position: relative;
      border-left: 6px solid #CF1417;
      font-family: 'Courier New', monospace;
      box-shadow: 8px 8px 0 rgba(216, 48, 26, 0.25);
      transform: translateY(12px);
      transition: transform 0.3s ease;
    }
    #info-popup.active .popup-card {
      transform: translateY(0);
    }
    .popup-accent {
      height: 4px;
      width: 42px;
      background: #CF1417;
      margin-bottom: 14px;
    }
    .popup-title {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: 26px;
      letter-spacing: 3px;
      margin: 0 0 14px;
      color: #111;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .popup-body {
      font-size: 14px;
      line-height: 1.65;
      letter-spacing: 0.3px;
      color: #1a1a1a;
    }
    .popup-close {
      position: absolute;
      top: 6px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 32px;
      font-family: Impact, sans-serif;
      cursor: pointer;
      color: #111;
      line-height: 1;
      padding: 4px 10px;
    }
    .popup-close:active {
      transform: translate(1px, 1px);
    }

  </style>
</head>
<body>

  <!-- Loading splash — показывается сразу при заходе на страницу,
       прячется когда MindAR прогревается (arReady) или по таймауту-страховке. -->
  <div id="ar-loading" aria-hidden="false">
    <div class="ar-spinner"></div>
    <p>ЗАПУСК · КАМЕРЫ</p>
  </div>

  <!-- Старт -->
  <div id="start-screen">
    <div class="stripes"><div class="s1"></div><div class="s2"></div><div class="s3"></div></div>
    <h1>УНОВИС<span class="accent">.</span></h1>
    <div class="sub">ВИТЕБСК · 1919—1922</div>
    <p>Наведи камеру на плакат<br>и увидишь, как супрематизм оживает<br>спустя 100 лет.</p>
    <button id="start-btn">НАЧАТЬ AR →</button>
    <p style="font-size:11px; opacity:0.5; margin-top:32px; letter-spacing:2px;">
      Требуется доступ к камере<br>Работает в Safari / Chrome на телефоне
    </p>
  </div>

  <div id="scan-hint">
    Наведите&nbsp;камеру на&nbsp;плакат
    <span class="hint-sub">Нажмите на&nbsp;фигуру</span>
  </div>
  <div id="detected-banner">● AR АКТИВЕН</div>

  <!-- Информационный поп-ап -->
  <div id="info-popup" aria-hidden="true">
    <div class="popup-card">
      <button class="popup-close" aria-label="Закрыть">×</button>
      <div class="popup-accent"></div>
      <h2 class="popup-title"></h2>
      <div class="popup-body"></div>
    </div>
  </div>

  <!-- A-Frame сцена с MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.00001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
    loading-screen="enabled: false"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- Локальные ресурсы можно положить сюда -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false">
      <!-- Курсор на основе тапа по экрану -->
      <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 20;"></a-entity>
    </a-camera>

    <!-- Свет — принудительно, чтобы материалы светились одинаково с любых углов -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 1 1"></a-entity>

    <!-- ============================================================ -->
    <!-- Цель 0: ПЛАКАТ 1 — классический Малевич                     -->
    <!-- Композиция вокруг красного квадрата. Дыхание + дрейф.       -->
    <!-- Координаты: A4 портретный, width=1 → X ∈ [-0.5; 0.5],       -->
    <!-- height=1.414 → Y ∈ [-0.707; +0.707]                         -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-1">

      <!-- Красный квадрат — главный центр композиции -->
      <a-plane
        class="clickable" data-info="red-square"
        position="0.05 0.15 0.05"
        width="0.32" height="0.32"
        rotation="0 0 8"
        material="shader: flat; color: #CF1417; side: double"
        animation__rot="property: rotation; from: 0 0 0; to: 0 0 16; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__float="property: position; from: -0.02 0.10 0.05; to: 0.12 0.20 0.05; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.96 0.96 1; to: 1.08 1.08 1; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; easing: easeOutCubic">
      </a-plane>

      <!-- Чёрный круг с белым ядром -->
      <a-circle
        class="clickable" data-info="black-disc"
        position="-0.3 -0.18 0.03"
        radius="0.14"
        material="shader: flat; color: #090910; side: double"
        animation__float="property: position; from: -0.36 -0.24 0.03; to: -0.24 -0.12 0.03; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; delay: 200; easing: easeOutCubic">
      </a-circle>
      <a-circle
        position="-0.3 -0.18 0.04"
        radius="0.05"
        material="shader: flat; color: #FFFFFF; side: double"
        animation__float="property: position; from: -0.36 -0.24 0.04; to: -0.24 -0.12 0.04; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__pulse="property: scale; from: 0.7 0.7 1; to: 1.3 1.3 1; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; delay: 350; easing: easeOutCubic">
      </a-circle>

      <!-- Жёлтый горизонтальный брусок — верхняя ось композиции -->
      <a-plane
        class="clickable" data-info="yellow-bar"
        position="0.0 0.45 0.02"
        width="0.55" height="0.045"
        rotation="0 0 4"
        material="shader: flat; color: #EDC205; side: double"
        animation__rot="property: rotation; from: 0 0 -2; to: 0 0 10; dir: alternate; loop: true; dur: 6200; easing: easeInOutSine"
        animation__float="property: position; from: -0.06 0.42 0.02; to: 0.06 0.48 0.02; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 700; easing: easeOutCubic">
      </a-plane>

      <!-- Синий треугольник правый-низ -->
      <a-triangle
        class="clickable" data-info="blue-tri"
        position="0.3 -0.4 0.04"
        vertex-a="0 0.16 0"
        vertex-b="-0.14 -0.08 0"
        vertex-c="0.14 -0.08 0"
        rotation="0 0 -15"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__rot="property: rotation; to: 0 0 345; loop: true; dur: 16000; easing: linear"
        animation__float="property: position; from: 0.24 -0.46 0.04; to: 0.34 -0.34 0.04; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 500; easing: easeOutCubic">
      </a-triangle>

      <!-- Зелёный архитектон-крест — баланс палитре -->
      <a-entity position="-0.32 0.35 0.06"
        animation__rot="property: rotation; to: 0 0 360; loop: true; dur: 12000; easing: linear"
        animation__float="property: position; from: -0.38 0.30 0.06; to: -0.26 0.40 0.06; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 1400; easing: easeOutCubic">
        <a-plane class="clickable" data-info="architekton" width="0.13" height="0.02" material="shader: flat; color: #0D803C; side: double"></a-plane>
        <a-plane class="clickable" data-info="architekton" width="0.02" height="0.13" material="shader: flat; color: #0D803C; side: double"></a-plane>
      </a-entity>

      <!-- Маленький красный круг — пульсар -->
      <a-circle
        class="clickable" data-info="small-red"
        position="0.4 -0.05 0.03"
        radius="0.04"
        material="shader: flat; color: #CF1417; side: double"
        animation__pulse="property: scale; from: 0.8 0.8 1; to: 1.6 1.6 1; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"
        animation__float="property: position; from: 0.36 -0.10 0.03; to: 0.44 0.00 0.03; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 1100; easing: easeOutCubic">
      </a-circle>

      <!-- Красная диагональная полоса — горизонт -->
      <a-plane
        class="clickable" data-info="red-diagonal"
        position="0 -0.55 0.01"
        width="0.95" height="0.018"
        rotation="0 0 -6"
        material="shader: flat; color: #CF1417; side: double"
        animation__rot="property: rotation; from: 0 0 -10; to: 0 0 -2; dir: alternate; loop: true; dur: 7400; easing: easeInOutSine"
        animation__float="property: position; from: -0.07 -0.57 0.01; to: 0.07 -0.53 0.01; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1200; delay: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Парящие квадратики-спутники -->
      <a-plane position="0.45 0.55 0.04" width="0.035" height="0.035"
        material="shader: flat; color: #090910; side: double"
        animation__rot="property: rotation; to: 0 0 360; loop: true; dur: 9000; easing: linear"
        animation__float="property: position; from: 0.40 0.50 0.04; to: 0.50 0.60 0.04; dir: alternate; loop: true; dur: 4600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; delay: 1700; easing: easeOutCubic">
      </a-plane>
      <a-plane position="-0.45 -0.45 0.04" width="0.03" height="0.03"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__rot="property: rotation; to: 0 0 -360; loop: true; dur: 11000; easing: linear"
        animation__float="property: position; from: -0.5 -0.5 0.04; to: -0.4 -0.4 0.04; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; delay: 1800; easing: easeOutCubic">
      </a-plane>

    </a-entity>

    <!-- ============================================================ -->
    <!-- Цель 1: ПЛАКАТ 2 — Лисицкий, "Клином красным"               -->
    <!-- Атака клина, разрушенный круг, динамика                     -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-2">

      <!-- Крупный белый круг — оборона -->
      <a-circle
        class="clickable" data-info="black-disc"
        position="0.22 0.0 0.02"
        radius="0.22"
        material="shader: flat; color: #FFFFFF; side: double"
        animation__breathe="property: scale; from: 0.96 0.96 1; to: 1.04 1.04 1; dir: alternate; loop: true; dur: 3600; easing: easeInOutSine"
        animation__float="property: position; from: 0.25 -0.02 0.02; to: 0.19 0.02 0.02; dir: alternate; loop: true; dur: 6200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; easing: easeOutCubic">
      </a-circle>

      <!-- Красный клин-треугольник, бьющий справа налево -->
      <a-triangle
        class="clickable" data-info="blue-tri"
        position="-0.05 0.0 0.04"
        vertex-a="0.35 0 0"
        vertex-b="-0.25 0.22 0"
        vertex-c="-0.25 -0.22 0"
        rotation="0 0 0"
        material="shader: flat; color: #CF1417; side: double"
        animation__strike="property: position; from: -0.10 0.0 0.04; to: 0.00 0.0 0.04; dir: alternate; loop: true; dur: 2800; easing: easeInOutQuad"
        animation__breathe="property: scale; from: 0.95 1 1; to: 1.1 1 1; dir: alternate; loop: true; dur: 2400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 400; easing: easeOutCubic">
      </a-triangle>

      <!-- Чёрный квадрат сверху — статика, противовес клину -->
      <a-plane
        class="clickable" data-info="red-square"
        position="-0.32 0.42 0.05"
        width="0.18" height="0.18"
        rotation="0 0 -8"
        material="shader: flat; color: #090910; side: double"
        animation__rot="property: rotation; from: 0 0 -14; to: 0 0 -2; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__float="property: position; from: -0.36 0.38 0.05; to: -0.28 0.46 0.05; dir: alternate; loop: true; dur: 5200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 700; easing: easeOutCubic">
      </a-plane>

      <!-- Жёлтая вертикальная полоса — ось плаката -->
      <a-plane
        class="clickable" data-info="black-vertical"
        position="-0.42 0.0 0.02"
        width="0.04" height="0.6"
        rotation="0 0 -2"
        material="shader: flat; color: #EDC205; side: double"
        animation__rot="property: rotation; from: 0 0 -6; to: 0 0 4; dir: alternate; loop: true; dur: 6400; easing: easeInOutSine"
        animation__float="property: position; from: -0.45 -0.04 0.02; to: -0.39 0.04 0.02; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__in="property: scale; from: 1 0 1; to: 1 1 1; dur: 1000; delay: 900; easing: easeOutCubic">
      </a-plane>

      <!-- Синие осколки-квадратики, разлетающиеся от удара -->
      <a-plane position="0.42 0.22 0.04" width="0.05" height="0.05"
        rotation="0 0 18"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__rot="property: rotation; to: 0 0 378; loop: true; dur: 7000; easing: linear"
        animation__float="property: position; from: 0.34 0.18 0.04; to: 0.46 0.26 0.04; dir: alternate; loop: true; dur: 4400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; delay: 1300; easing: easeOutCubic">
      </a-plane>
      <a-plane position="0.40 -0.28 0.04" width="0.04" height="0.04"
        rotation="0 0 -22"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__rot="property: rotation; to: 0 0 -382; loop: true; dur: 8000; easing: linear"
        animation__float="property: position; from: 0.34 -0.32 0.04; to: 0.44 -0.24 0.04; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; delay: 1500; easing: easeOutCubic">
      </a-plane>

      <!-- Малый красный круг — пульсирующая точка прицела -->
      <a-circle
        class="clickable" data-info="small-red"
        position="0.30 0.0 0.06"
        radius="0.025"
        material="shader: flat; color: #CF1417; side: double"
        animation__pulse="property: scale; from: 0.6 0.6 1; to: 1.8 1.8 1; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 1700; easing: easeOutCubic">
      </a-circle>

      <!-- Зелёная диагональ — встречное движение -->
      <a-plane
        class="clickable" data-info="red-diagonal"
        position="-0.05 -0.5 0.01"
        width="0.85" height="0.022"
        rotation="0 0 8"
        material="shader: flat; color: #0D803C; side: double"
        animation__rot="property: rotation; from: 0 0 4; to: 0 0 12; dir: alternate; loop: true; dur: 7000; easing: easeInOutSine"
        animation__float="property: position; from: -0.12 -0.52 0.01; to: 0.02 -0.48 0.01; dir: alternate; loop: true; dur: 6000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1200; delay: 1100; easing: easeOutCubic">
      </a-plane>

    </a-entity>

    <!-- ============================================================ -->
    <!-- Цель 2: ПЛАКАТ 3 — архитектон, тяжёлая композиция            -->
    <!-- Вертикали и горизонтали, плотный чёрный, точечный акцент    -->
    <!-- ============================================================ -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-3">

      <!-- Главная чёрная вертикаль — колонна архитектона -->
      <a-plane
        class="clickable" data-info="black-vertical"
        position="-0.08 0.08 0.03"
        width="0.07" height="0.78"
        rotation="0 0 0"
        material="shader: flat; color: #090910; side: double"
        animation__rot="property: rotation; from: 0 0 -3; to: 0 0 3; dir: alternate; loop: true; dur: 6800; easing: easeInOutSine"
        animation__float="property: position; from: -0.10 0.06 0.03; to: -0.06 0.10 0.03; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 1 0 1; to: 1 1 1; dur: 1100; easing: easeOutCubic">
      </a-plane>

      <!-- Длинная горизонталь — карниз -->
      <a-plane
        class="clickable" data-info="yellow-bar"
        position="0.08 0.30 0.02"
        width="0.7" height="0.06"
        rotation="0 0 2"
        material="shader: flat; color: #090910; side: double"
        animation__float="property: position; from: 0.04 0.28 0.02; to: 0.12 0.32 0.02; dir: alternate; loop: true; dur: 5800; easing: easeInOutSine"
        animation__rot="property: rotation; from: 0 0 0; to: 0 0 4; dir: alternate; loop: true; dur: 7200; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1000; delay: 300; easing: easeOutCubic">
      </a-plane>

      <!-- Жёлтый круг — солнце над архитектурой -->
      <a-circle
        class="clickable" data-info="black-disc"
        position="0.30 0.50 0.04"
        radius="0.11"
        material="shader: flat; color: #EDC205; side: double"
        animation__breathe="property: scale; from: 0.94 0.94 1; to: 1.06 1.06 1; dir: alternate; loop: true; dur: 3400; easing: easeInOutSine"
        animation__float="property: position; from: 0.26 0.46 0.04; to: 0.34 0.54 0.04; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1100; delay: 500; easing: easeOutCubic">
      </a-circle>

      <!-- Малый красный квадрат — акцент в плотной чёрной массе -->
      <a-plane
        class="clickable" data-info="red-square"
        position="0.18 -0.08 0.05"
        width="0.13" height="0.13"
        rotation="0 0 -6"
        material="shader: flat; color: #CF1417; side: double"
        animation__rot="property: rotation; from: 0 0 -10; to: 0 0 2; dir: alternate; loop: true; dur: 5500; easing: easeInOutSine"
        animation__float="property: position; from: 0.14 -0.12 0.05; to: 0.22 -0.04 0.05; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__breathe="property: scale; from: 0.95 0.95 1; to: 1.08 1.08 1; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 800; easing: easeOutCubic">
      </a-plane>

      <!-- Синяя горизонталь снизу — фундамент -->
      <a-plane
        class="clickable" data-info="red-diagonal"
        position="0.05 -0.42 0.02"
        width="0.65" height="0.05"
        rotation="0 0 -3"
        material="shader: flat; color: #2D2C7F; side: double"
        animation__rot="property: rotation; from: 0 0 -5; to: 0 0 1; dir: alternate; loop: true; dur: 6400; easing: easeInOutSine"
        animation__float="property: position; from: 0.00 -0.44 0.02; to: 0.10 -0.40 0.02; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 1 1; to: 1 1 1; dur: 1100; delay: 1000; easing: easeOutCubic">
      </a-plane>

      <!-- Зелёный треугольник — динамика в архитектуре -->
      <a-triangle
        class="clickable" data-info="blue-tri"
        position="-0.32 -0.28 0.04"
        vertex-a="0 0.13 0"
        vertex-b="-0.11 -0.07 0"
        vertex-c="0.11 -0.07 0"
        rotation="0 0 25"
        material="shader: flat; color: #0D803C; side: double"
        animation__rot="property: rotation; to: 0 0 385; loop: true; dur: 14000; easing: linear"
        animation__float="property: position; from: -0.36 -0.32 0.04; to: -0.28 -0.24 0.04; dir: alternate; loop: true; dur: 5400; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 1200; easing: easeOutCubic">
      </a-triangle>

      <!-- Пульсирующий красный круг — точка фокуса -->
      <a-circle
        class="clickable" data-info="small-red"
        position="-0.36 0.42 0.04"
        radius="0.04"
        material="shader: flat; color: #CF1417; side: double"
        animation__pulse="property: scale; from: 0.7 0.7 1; to: 1.5 1.5 1; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"
        animation__float="property: position; from: -0.40 0.38 0.04; to: -0.32 0.46 0.04; dir: alternate; loop: true; dur: 4800; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 900; delay: 1500; easing: easeOutCubic">
      </a-circle>

      <!-- Чёрно-красный архитектон-крест -->
      <a-entity position="0.40 -0.55 0.06"
        animation__rot="property: rotation; to: 0 0 -360; loop: true; dur: 13000; easing: linear"
        animation__float="property: position; from: 0.36 -0.58 0.06; to: 0.44 -0.52 0.06; dir: alternate; loop: true; dur: 5600; easing: easeInOutSine"
        animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 1000; delay: 1700; easing: easeOutCubic">
        <a-plane class="clickable" data-info="architekton" width="0.14" height="0.022" material="shader: flat; color: #090910; side: double"></a-plane>
        <a-plane class="clickable" data-info="architekton" width="0.022" height="0.14" material="shader: flat; color: #CF1417; side: double"></a-plane>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const scanHint = document.getElementById('scan-hint');
    const banner = document.getElementById('detected-banner');
    const sceneEl = document.querySelector('a-scene');

    // ======== Инфо-поп-ап для фигур ========
    const INFO = {
      'red-square': {
        title: 'Красный квадрат',
        body: 'Малевич, 1915. Красный квадрат — «крестьянка в двух измерениях», живое в противовес чёрному. Цвет как чистая энергия, освобождённая от вещи.'
      },
      'black-disc': {
        title: 'Круг',
        body: 'Одна из трёх супрематических праформ вместе с квадратом и крестом. Круг — движение, планета, полное отрицание земного притяжения.'
      },
      'blue-tri': {
        title: 'Треугольник',
        body: '«Клином красным бей белых!» — плакат Лисицкого, 1919. Треугольник стал у УНОВИСа знаком удара, вектора, революционного движения.'
      },
      'yellow-bar': {
        title: 'Жёлтая горизонталь',
        body: 'Горизонталь — основание нового мира. Жёлтый у супрематистов — цвет света и энергии, маркер границы между старым и новым порядком.'
      },
      'red-diagonal': {
        title: 'Диагональ',
        body: 'Диагональ взрывает статику прямоугольного мира. Для Лисицкого это траектория полёта, ось космической динамики. «ПРОУН» — проект утверждения нового.'
      },
      'black-vertical': {
        title: 'Вертикаль',
        body: 'Минимум средств — максимум смысла. Вертикаль как ось мира, опора супрематической архитектуры. Чашник и Суетин строили из таких элементов фарфор и ткани.'
      },
      'small-red': {
        title: 'Точка',
        body: 'Элементарная частица супрематизма. По Малевичу: из точки рождается линия, из линии — плоскость, из плоскости — новая вселенная.'
      },
      'unovis-text': {
        title: 'УНОВИС',
        body: 'Утвердители Нового Искусства. Витебск, 1919–1922. Малевич, Лисицкий, Чашник, Суетин, Хидекель, Юдин. Коллектив, впервые объявивший искусство инструментом построения мира.'
      },
      'architekton': {
        title: 'Архитектон',
        body: 'Объёмная супрематическая композиция. Малевич проектировал архитектоны как модели городов будущего — летающих, вне гравитации, из чистых геометрических форм.'
      }
    };

    const popup = document.getElementById('info-popup');
    const popupTitle = popup.querySelector('.popup-title');
    const popupBody = popup.querySelector('.popup-body');
    const popupClose = popup.querySelector('.popup-close');

    function openPopup(key) {
      const entry = INFO[key];
      if (!entry) return;
      popupTitle.textContent = entry.title;
      popupBody.textContent = entry.body;
      popup.classList.add('active');
      popup.setAttribute('aria-hidden', 'false');
    }
    function closePopup() {
      popup.classList.remove('active');
      popup.setAttribute('aria-hidden', 'true');
    }

    popupClose.addEventListener('click', closePopup);
    popup.addEventListener('click', (e) => {
      if (e.target === popup) closePopup();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
    });

    // ======== Надёжный обработчик тапов через THREE.Raycaster ========
    // A-Frame cursor не всегда срабатывает с MindAR, поэтому кастуем луч вручную.
    function setupTapHandler() {
      const THREE_LIB = AFRAME.THREE;
      const raycaster = new THREE_LIB.Raycaster();
      const pointer = new THREE_LIB.Vector2();

      function performRaycast(clientX, clientY) {
        const canvas = sceneEl.canvas;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        const threeCamera = sceneEl.camera;
        if (!threeCamera) return;
        raycaster.setFromCamera(pointer, threeCamera);

        // Собираем все mesh'и из .clickable энтити (для плоскостей, кругов, текста и т.п.)
        const clickableEls = Array.from(document.querySelectorAll('.clickable'));
        const meshes = [];
        const meshToEl = new Map();
        clickableEls.forEach(el => {
          if (!el.object3D) return;
          el.object3D.traverse(node => {
            if (node.isMesh) {
              meshes.push(node);
              meshToEl.set(node, el);
            }
          });
        });

        if (meshes.length === 0) return;

        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length === 0) {
          console.log('[AR] tap miss');
          return;
        }
        const el = meshToEl.get(hits[0].object);
        if (!el) return;
        const key = el.dataset.info;
        console.log('[AR] hit:', key);
        if (key) openPopup(key);
      }

      const canvas = sceneEl.canvas;
      if (!canvas) {
        console.warn('[AR] canvas not ready yet');
        return;
      }
      // pointerup работает и для мыши, и для касаний; в отличие от click, не имеет 300ms задержки на iOS
      canvas.addEventListener('pointerup', (e) => {
        // Игнорируем тапы с зажатой правой кнопкой и т.п.
        if (e.button && e.button !== 0) return;
        performRaycast(e.clientX, e.clientY);
      });
      // Фолбэк для старых браузеров без PointerEvent
      canvas.addEventListener('touchend', (e) => {
        if (window.PointerEvent) return; // иначе задвоит
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        performRaycast(t.clientX, t.clientY);
      });

      console.log('[AR] tap handler ready, clickable elements:', document.querySelectorAll('.clickable').length);
    }

    if (sceneEl.hasLoaded && sceneEl.canvas) {
      setupTapHandler();
    } else {
      sceneEl.addEventListener('loaded', setupTapHandler);
    }

    // ===== Loading splash — управление видимостью =====
    const arLoading = document.getElementById('ar-loading');
    function hideLoading() {
      if (arLoading && !arLoading.classList.contains('hidden')) {
        arLoading.classList.add('hidden');
        // Полностью убрать через 400ms (после анимации opacity)
        setTimeout(() => { arLoading.style.display = 'none'; }, 400);
      }
    }
    // Страховка: если что-то пошло не так — спрятать спиннер по таймауту
    const loadingSafetyTimeout = setTimeout(hideLoading, 12000);

    // Глобальные обработчики MindAR
    sceneEl.addEventListener('arReady', () => {
      console.log('MindAR готов');
      clearTimeout(loadingSafetyTimeout);
      // arReady — это инит трекера. Видеопоток камеры может ещё не показаться.
      // Ждём первый кадр в <video>, чтобы splash скрылся, когда экран реально готов.
      const video = document.querySelector('video');
      if (video) {
        const onFirst = () => {
          hideLoading();
          video.removeEventListener('loadeddata', onFirst);
          video.removeEventListener('playing', onFirst);
        };
        video.addEventListener('loadeddata', onFirst);
        video.addEventListener('playing', onFirst);
        // Страховка: если события не сработают за 1.5с — всё равно скрыть.
        setTimeout(hideLoading, 1500);
      } else {
        hideLoading();
      }
    });
    sceneEl.addEventListener('arError', (e) => {
      console.error('MindAR error', e);
      hideLoading();
      alert('Не удалось запустить AR.\n\nПроверь:\n1. Сайт открыт по https:// или localhost\n2. Браузер получил доступ к камере\n3. Файл targets.mind лежит рядом с ar.html');
    });

    // Таргет-события — все 3 плаката шарят один баннер/хинт
    const targets = [
      { el: document.querySelector('#target-1'), label: 'ПЛАКАТ I' },
      { el: document.querySelector('#target-2'), label: 'ПЛАКАТ II' },
      { el: document.querySelector('#target-3'), label: 'ПЛАКАТ III' }
    ];
    let activeTargets = 0;
    targets.forEach(({ el, label }) => {
      if (!el) return;
      el.addEventListener('targetFound', () => {
        activeTargets++;
        scanHint.style.display = 'none';
        banner.textContent = '● AR · ' + label;
        banner.style.display = 'block';
      });
      el.addEventListener('targetLost', () => {
        activeTargets = Math.max(0, activeTargets - 1);
        if (activeTargets === 0) {
          banner.style.display = 'none';
          scanHint.style.display = 'block';
        }
      });
    });

    // Старт камеры — общая функция
    function startAR() {
      startScreen.style.display = 'none';
      scanHint.style.display = 'block';
      // На случай если arReady не дойдёт до splash (медленный init) — спрячем по запуску камеры
      // через короткую задержку, чтобы не висел спиннер пока MindAR крутит колёсами.
      setTimeout(hideLoading, 800);

      const begin = () => {
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) {
          alert('MindAR не инициализирован. Перезагрузи страницу.');
          return;
        }
        try {
          const result = arSystem.start();
          if (result && typeof result.then === 'function') {
            result.catch(err => {
              console.error(err);
              // Если автозапуск упёрся в требование user-gesture iOS — возвращаем стартовый экран
              if (autostartRequested) {
                startScreen.style.display = 'flex';
                scanHint.style.display = 'none';
              } else {
                alert('Не удалось запустить камеру: ' + (err && err.message ? err.message : err));
              }
            });
          }
        } catch (err) {
          console.error(err);
          if (autostartRequested) {
            startScreen.style.display = 'flex';
            scanHint.style.display = 'none';
          } else {
            alert('Ошибка запуска AR: ' + (err && err.message ? err.message : err));
          }
        }
      };

      if (sceneEl.hasLoaded) {
        begin();
      } else {
        sceneEl.addEventListener('loaded', begin, { once: true });
      }
    }

    // Старт по тапу — нужен для iOS, если не пришли с ?go=1
    startBtn.addEventListener('click', startAR);

    // ===== Авто-старт по URL-параметру ?go=1 =====
    // Если страница пришла из index.html по клику — открываем камеру без второго тапа.
    // Учитываем prerender: Chrome/Edge могут предзагрузить ar.html в фоне (через
    // Speculation Rules на index.html). В prerender-состоянии getUserMedia заблокирован,
    // поэтому ждём `prerenderingchange` (страница активирована переходом с лендинга).
    const autostartRequested = new URLSearchParams(location.search).get('go') === '1';
    if (autostartRequested) {
      startScreen.style.display = 'none';

      const tryAutoStart = () => {
        if (sceneEl.hasLoaded) {
          startAR();
        } else {
          sceneEl.addEventListener('loaded', startAR, { once: true });
        }
      };

      const onActivated = () => {
        // Страница либо никогда не была prerendered, либо только что активировалась
        if (document.readyState === 'complete') {
          tryAutoStart();
        } else {
          window.addEventListener('load', tryAutoStart, { once: true });
        }
      };

      if (document.prerendering) {
        // Не вызываем getUserMedia до активации — браузер всё равно отложит.
        // Спиннер уже показан, скрипты грузятся в фоне → к моменту активации почти всё готово.
        document.addEventListener('prerenderingchange', onActivated, { once: true });
      } else {
        onActivated();
      }
    } else {
      // Зашли напрямую без ?go=1 — нужен ручной тап. Прячем splash, показываем стартовый экран.
      hideLoading();
    }
  </script>
